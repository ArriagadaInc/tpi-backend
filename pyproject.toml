[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "tu-pension-inteligente-backoffice"
version = "0.1.0"
description = "API pública y backoffice web (CRM Lite) para captura y consulta de solicitudes de simulación de pensión."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Tu Pensión Inteligente", email = "dev@tupensioninteligente.cl"}
]

dependencies = [
    # Database
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "sqlalchemy>=2.0.0",
    
    # Data validation and models
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    
    # Utilities
    "python-dotenv>=1.2.2",
    "pytz>=2023.3",
    "boto3>=1.43.72,<2.0",
    "argon2-cffi>=25.1.0,<26.0",
    "fastapi>=0.139.0,<0.140.0",

    # Web server and templates. uvicorn serves app.api.main and app.web.main;
    # Jinja2 renders the CRM templates; python-multipart parses the login form;
    # itsdangerous signs the Starlette session cookies.
    "uvicorn>=0.52.0",
    "Jinja2>=3.1.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",

    # XLSX export (H3.3.6). Write-only usage: no defusedxml needed at runtime.
    "openpyxl>=3.1.5,<4.0",

    # Simulador de renta vitalicia (SIM-RV-V1). Módulo puro: numpy para mortalidad.
    "numpy>=2.5.1,<3.0",

    # PDF efímero (SIM-RV-V1). Rueda pura Python.
    "reportlab==5.0.1",

    # Image processing for the PDF logo and future user-file uploads.
    # Pinned >=13 to close the Pillow 12.3.0 pip-audit exceptions (SEG-DESACOPLAR-STREAMLIT).
    "pillow>=13.0.0",
]

[tool.setuptools.package-data]
"app.simulador_pension" = ["datos/*.npz"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "bandit>=1.8.0",
    "pip-audit>=2.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # Line too long - handled by formatter

[tool.ruff.lint.per-file-ignores]
"app/simulador_pension/*.py" = ["N803", "N806"]  # notación matemática (A, Q, P, N, D, ...)
"tests/unit/test_adjuntos_s3_infra.py" = ["N803"]  # el doble imita los argumentos de boto3 (Bucket, Key...)

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers -v --basetemp=.pytest-tmp -o cache_dir=.pytest-cache --cov=app --cov-report=term-missing"
markers = [
    "unit: Tests de unidad",
    "integration: Tests de integración con BD",
    "e2e: Tests end-to-end",
    "security: Tests de seguridad",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
