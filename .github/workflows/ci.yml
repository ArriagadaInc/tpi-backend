name: CI - Linting, Tests & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      
      - name: Ruff check
        run: ruff check app/ tests/ scripts/ deployment/
      
      - name: Black format check
        run: black --check app/ tests/ scripts/ deployment/
      
      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tpi_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tpi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .

      - name: Initialize test database
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: python scripts/init_test_database.py
      
      - name: Run tests
        env:
          # Deliberately non-production value. CI never reads deployment secrets.
          API_IDEMPOTENCY_HMAC_SECRET: ci-testing-hmac-secret-not-for-runtime
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=85
      
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      
      - name: Run pip-audit
        run: pip-audit --requirement requirements/runtime.lock
      
      - name: Run bandit
        run: bandit -r app/ --severity-level medium --confidence-level medium

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build application image
        run: docker build --tag tpi-backoffice-h21:${{ github.sha }} .

      - name: Validate Docker Compose topology
        run: docker compose config --quiet

      - name: Build complete Compose topology
        run: docker compose build

      - name: Build custom Caddy image
        run: docker build --tag tpi-dev-caddy:${{ github.sha }} --file deployment/caddy/Dockerfile .

      - name: Verify runtime OpenSSL packages
        run: |
          docker run --rm tpi-backoffice-h21:${{ github.sha }} \
            sh -c 'apk info -v libssl3 libcrypto3 && apk list --installed | grep -E "^lib(ssl3|crypto3)-"'
          docker run --rm tpi-dev-caddy:${{ github.sha }} \
            sh -c 'apk info -v libssl3 libcrypto3 && apk list --installed | grep -E "^lib(ssl3|crypto3)-"'

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          tpi-dev-caddy:${{ github.sha }}
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build validation-only Elastic Beanstalk bundle
        env:
          APP_IMAGE: ci.example.invalid/tpi-dev-app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CADDY_IMAGE: ci.example.invalid/tpi-dev-caddy@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          runtime_sha="${GITHUB_SHA}"
          bundle="dist/tpi-dev-ecr-${runtime_sha:0:7}.zip"
          python deployment/build_eb_ecr_bundle.py \
            --template deployment/aws/docker-compose.ecr.yml \
            --output "$bundle" \
            --runtime-git-sha "$runtime_sha" \
            --app-image "$APP_IMAGE" \
            --caddy-image "$CADDY_IMAGE"

      - name: Validate Linux EB source bundle
        env:
          DATABASE_HOST: ci-postgres
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: ci-not-a-secret
          API_IDEMPOTENCY_HMAC_SECRET: ci-not-a-secret
          AUTH_USERS_JSON: '{"users":[]}'
          WEB_SESSION_SECRET: ci-web-session-secret-not-for-runtime
          TPI_PUBLIC_SITE_URL: https://dev.example.test
          TPI_PUBLIC_SITE_ADDRESS: https://dev.example.test
          TPI_BACKOFFICE_SITE_ADDRESS: https://backoffice.dev.example.test
        run: |
          runtime_sha="${GITHUB_SHA}"
          bundle="dist/tpi-dev-ecr-${runtime_sha:0:7}.zip"
          unzip -t "$bundle"
          unzip -l "$bundle"
          bundle_dir="$(mktemp -d)"
          unzip -q "$bundle" -d "$bundle_dir"
          test "$(find "$bundle_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          test -f "$bundle_dir/docker-compose.yml"
          docker compose -f "$bundle_dir/docker-compose.yml" config --quiet

      - name: Upload validated EB bundle
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-only-eb-bundle-${{ github.sha }}
          path: dist/tpi-dev-ecr-*.zip
          if-no-files-found: error

  release-tooling-validation:
    name: Release Tooling Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify frozen candidate artifact contract
        env:
          APP_IMAGE: ci.example.invalid/tpi-dev-app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CADDY_IMAGE: ci.example.invalid/tpi-dev-caddy@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          set -euo pipefail
          runtime_sha="$GITHUB_SHA"
          bundle_name="tpi-dev-ecr-${runtime_sha:0:7}.zip"
          manifest_name="tpi-dev-ecr-${runtime_sha:0:7}.manifest.json"
          mkdir -p artifact dist

          python deployment/build_eb_ecr_bundle.py \
            --template deployment/aws/docker-compose.ecr.yml \
            --output "dist/$bundle_name" \
            --runtime-git-sha "$runtime_sha" \
            --app-image "$APP_IMAGE" \
            --caddy-image "$CADDY_IMAGE"

          bundle_sha="$(sha256sum "dist/$bundle_name" | awk '{print $1}')"
          cp "dist/$bundle_name" "artifact/$bundle_name"
          jq -n \
            --arg runtime "$runtime_sha" \
            --arg app "$APP_IMAGE" \
            --arg caddy "$CADDY_IMAGE" \
            --arg bundle_sha "$bundle_sha" \
            '{runtime_git_sha:$runtime, app_image:$app, caddy_image:$caddy, bundle_sha256:$bundle_sha}' \
            > "artifact/$manifest_name"

          export ARTIFACT_DIR=artifact
          export BUNDLE_NAME="$bundle_name"
          export MANIFEST_NAME="$manifest_name"
          export BUNDLE_SHA256="$bundle_sha"
          export SOURCE_SHA="$runtime_sha"
          bash scripts/release/verify_frozen_candidate.sh

          promotion_output="dist/tpi-dev-candidate-data-${runtime_sha:0:7}.zip"
          python deployment/aws/build_promotion_data.py \
            --artifact-dir artifact \
            --bundle-name "$bundle_name" \
            --manifest-name "$manifest_name" \
            --output "$promotion_output"
          test "$(zipinfo -1 "$promotion_output" | sort)" = \
            $'artifact/'"$manifest_name"$'\nartifact/'"$bundle_name"

      - name: Run actionlint
        run: |
          # actionlint 1.7.7 does not know the documented artifact-ids input.
          # Keep the release contract and suppress only this compatibility
          # warning plus pre-existing ShellCheck findings in untouched workflows.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            rhysd/actionlint:1.7.7 \
            -ignore 'input "artifact-ids" is not defined|SC2034|SC2016|SC2129|SC2153' \
            /repo/.github/workflows/ci.yml \
            /repo/.github/workflows/deploy-dev-eb.yml \
            /repo/.github/workflows/preflight-dev-eb.yml \
            /repo/.github/workflows/publish-dev-ecr-images.yml
