name: CI - Linting, Tests & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      
      - name: Ruff check
        run: ruff check app/ tests/ scripts/ deployment/
      
      - name: Black format check
        run: black --check app/ tests/ scripts/ deployment/
      
      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tpi_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tpi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .

      - name: Initialize test database
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: python scripts/init_test_database.py
      
      - name: Run tests
        env:
          # Deliberately non-production value. CI never reads deployment secrets.
          API_IDEMPOTENCY_HMAC_SECRET: ci-testing-hmac-secret-not-for-runtime
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=85
      
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      
      - name: Run pip-audit
        run: pip-audit --requirement requirements/runtime.lock
      
      - name: Run bandit
        run: bandit -r app/ --severity-level medium --confidence-level medium

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build application image
        run: docker build --tag tpi-backoffice-h21:${{ github.sha }} .

      - name: Validate Docker Compose topology
        run: docker compose config --quiet

      - name: Build complete Compose topology
        run: docker compose build

      - name: Build custom Caddy image
        run: docker build --tag tpi-dev-caddy:${{ github.sha }} --file deployment/caddy/Dockerfile .

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          tpi-dev-caddy:${{ github.sha }}
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build CI validation EB bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          RELEASE_TREE_SHA="$(git rev-parse HEAD^{tree})"
          CI_APP_IMAGE="example.invalid/tpi-dev-app@sha256:$(printf '%s%s' "$RELEASE_SHA" "$RELEASE_SHA" | cut -c1-64)"
          CI_CADDY_IMAGE="example.invalid/tpi-dev-caddy@sha256:$(printf '%s%s' "$RELEASE_SHA" "$RELEASE_SHA" | cut -c1-64)"
          bundle_name="h2-5d-ecr-${RELEASE_SHA:0:7}.zip"
          python deployment/build_eb_ecr_bundle.py \
            --template deployment/aws/docker-compose.ecr.yml \
            --output "dist/$bundle_name" \
            --runtime-git-sha "$RELEASE_SHA" \
            --git-tree-sha "$RELEASE_TREE_SHA" \
            --app-image "$CI_APP_IMAGE" \
            --caddy-image "$CI_CADDY_IMAGE" \
            --environment aws-dev \
            --eb-version "tpi-${RELEASE_SHA:0:7}" \
            --repository "ArriagadaInc/tpi-backend" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"

      - name: Validate Linux EB source bundle
        env:
          DATABASE_HOST: ci-postgres
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: ci-not-a-secret
          API_IDEMPOTENCY_HMAC_SECRET: ci-not-a-secret
          AUTH_USERS_JSON: '{"users":[]}'
          TPI_PUBLIC_SITE_ADDRESS: https://dev.example.test
          TPI_BACKOFFICE_SITE_ADDRESS: https://backoffice.dev.example.test
        run: |
          unzip -t "dist/h2-5d-ecr-${{ github.sha }}.zip"
          unzip -l "dist/h2-5d-ecr-${{ github.sha }}.zip"
          bundle_dir="$(mktemp -d)"
          unzip -q "dist/h2-5d-ecr-${{ github.sha }}.zip" -d "$bundle_dir"
          test "$(find "$bundle_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          test -f "$bundle_dir/docker-compose.yml"
          docker compose -f "$bundle_dir/docker-compose.yml" config --quiet

      - name: Upload validated EB bundle
        uses: actions/upload-artifact@v4
        with:
          name: h2-5d-ecr-${{ github.sha }}
          path: dist/h2-5d-ecr-${{ github.sha }}.zip
          if-no-files-found: error
