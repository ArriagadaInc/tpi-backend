name: CI - Linting, Tests & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      
      - name: Ruff check
        run: ruff check app/ tests/ scripts/
      
      - name: Black format check
        run: black --check app/ tests/ scripts/
      
      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tpi_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tpi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .

      - name: Initialize test database
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: python scripts/init_test_database.py
      
      - name: Run tests
        env:
          # Deliberately non-production value. CI never reads deployment secrets.
          API_IDEMPOTENCY_HMAC_SECRET: ci-testing-hmac-secret-not-for-runtime
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=85
      
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      
      - name: Run pip-audit
        run: pip-audit --requirement requirements/runtime.lock
      
      - name: Run bandit
        run: bandit -r app/ --severity-level medium --confidence-level medium

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build application image
        run: docker build --tag tpi-backoffice-h21:${{ github.sha }} .

      - name: Validate Docker Compose topology
        run: docker compose config --quiet

      - name: Build complete Compose topology
        run: docker compose build

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env TPI_PUBLIC_DOMAIN=dev.example.test
          --volume "$GITHUB_WORKSPACE/deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
