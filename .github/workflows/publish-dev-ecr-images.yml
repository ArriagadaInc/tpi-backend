name: Publish immutable DEV images to ECR

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable Git SHA to validate, build, and publish.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: '821656895812'
  ECR_APP_REPOSITORY: tpi-dev-app
  ECR_CADDY_REPOSITORY: tpi-dev-caddy

jobs:
  authorize-source:
    name: Authorize source revision
    runs-on: ubuntu-latest
    steps:
      - name: Validate source SHA and repository authorization
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const sourceSha = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              core.setFailed('source_sha must be a full lowercase 40-character Git SHA.');
              return;
            }

            const { owner, repo } = context.repo;
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: sourceSha });
            if (commit.data.sha !== sourceSha) {
              core.setFailed('source_sha does not identify the requested repository commit.');
              return;
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: 'main',
              head: sourceSha,
            });
            const belongsToMain = ['identical', 'behind'].includes(comparison.data.status);

            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: sourceSha,
              state: 'open',
              per_page: 100,
            });
            const exactOpenPullRequest = associated.data.some((pullRequest) => (
              pullRequest.base.ref === 'main'
              && pullRequest.head.sha === sourceSha
              && pullRequest.head.repo?.full_name === `${owner}/${repo}`
            ));

            if (!belongsToMain && !exactOpenPullRequest) {
              core.setFailed(
                'source_sha is not contained in main and is not the exact HEAD of an open same-repository PR to main.'
              );
              return;
            }

            core.info(
              `Authorized ${sourceSha} via ${belongsToMain ? 'main ancestry' : 'open same-repository PR to main'}.`
            );

  lint:
    name: Lint & Format
    needs: authorize-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      - run: ruff check app/ tests/ scripts/ deployment/
      - run: black --check app/ tests/ scripts/ deployment/
      - run: mypy app/ --ignore-missing-imports

  test:
    name: Tests
    needs: authorize-source
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tpi_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tpi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Initialize test database
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: python scripts/init_test_database.py
      - name: Run tests
        env:
          API_IDEMPOTENCY_HMAC_SECRET: ci-testing-hmac-secret-not-for-runtime
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=85

  security:
    name: Security Audit
    needs: authorize-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      - run: pip-audit --requirement requirements/runtime.lock
      - run: bandit -r app/ --severity-level medium --confidence-level medium

  docker-validate:
    name: Docker Build
    needs: authorize-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - run: docker build --tag tpi-dev-app:${{ inputs.source_sha }} .
      - run: docker build --tag tpi-dev-caddy:${{ inputs.source_sha }} --file deployment/caddy/Dockerfile .
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          tpi-dev-caddy:${{ inputs.source_sha }}
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publish:
    name: Publish immutable images and release bundle
    needs: [lint, test, security, docker-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::821656895812:role/tpi-github-actions-dev-ecr-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tpi-dev-ecr-${{ github.run_id }}
      - name: Authenticate Docker to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable images
        id: images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          expected_registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          if [ "$REGISTRY" != "$expected_registry" ]; then
            echo "Unexpected ECR registry: $REGISTRY"
            exit 1
          fi
          docker build --tag "$REGISTRY/$ECR_APP_REPOSITORY:$SOURCE_SHA" .
          docker build --tag "$REGISTRY/$ECR_CADDY_REPOSITORY:$SOURCE_SHA" --file deployment/caddy/Dockerfile .
          docker push "$REGISTRY/$ECR_APP_REPOSITORY:$SOURCE_SHA"
          docker push "$REGISTRY/$ECR_CADDY_REPOSITORY:$SOURCE_SHA"
          app_digest=$(aws ecr describe-images --repository-name "$ECR_APP_REPOSITORY" --image-ids imageTag="$SOURCE_SHA" --query 'imageDetails[0].imageDigest' --output text)
          caddy_digest=$(aws ecr describe-images --repository-name "$ECR_CADDY_REPOSITORY" --image-ids imageTag="$SOURCE_SHA" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$app_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$caddy_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "app_image=$REGISTRY/$ECR_APP_REPOSITORY@$app_digest" >> "$GITHUB_OUTPUT"
          echo "caddy_image=$REGISTRY/$ECR_CADDY_REPOSITORY@$caddy_digest" >> "$GITHUB_OUTPUT"
      - name: Fail closed on high or critical ECR findings
        env:
          IMAGE_TAG: ${{ inputs.source_sha }}
        run: |
          for repository in "$ECR_APP_REPOSITORY" "$ECR_CADDY_REPOSITORY"; do
            for attempt in $(seq 1 30); do
              status=$(aws ecr describe-image-scan-findings \
                --repository-name "$repository" \
                --image-id imageTag="$IMAGE_TAG" \
                --query 'imageScanStatus.status' \
                --output text 2>/dev/null || true)
              if [ "$status" = "COMPLETE" ]; then
                break
              fi
              sleep 10
            done
            if [ "$status" != "COMPLETE" ]; then
              echo "ECR scan did not complete for $repository within five minutes."
              exit 1
            fi
            critical=$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanFindings.findingSeverityCounts.CRITICAL || `0`' \
              --output text)
            high=$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanFindings.findingSeverityCounts.HIGH || `0`' \
              --output text)
            echo "$repository: CRITICAL=$critical HIGH=$high"
            if [ "$critical" != "0" ] || [ "$high" != "0" ]; then
              echo "ECR deployment eligibility requires CRITICAL=0 and HIGH=0 for $repository."
              exit 1
            fi
          done
      - name: Build and validate release bundle
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          APP_IMAGE: ${{ steps.images.outputs.app_image }}
          CADDY_IMAGE: ${{ steps.images.outputs.caddy_image }}
          DATABASE_HOST: ci-placeholder.invalid
          DATABASE_NAME: tpi
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: ci-not-a-secret
          API_IDEMPOTENCY_HMAC_SECRET: ci-not-a-secret
          AUTH_USERS_JSON: '{"users":[]}'
          WEB_SESSION_SECRET: ci-web-session-secret-not-for-runtime
          TPI_PUBLIC_SITE_URL: https://dev.example.test
          TPI_PUBLIC_SITE_ADDRESS: https://dev.example.test
          TPI_BACKOFFICE_SITE_ADDRESS: https://backoffice.dev.example.test
        run: |
          bundle="dist/tpi-dev-ecr-${SOURCE_SHA:0:7}.zip"
          python deployment/build_eb_ecr_bundle.py \
            --template deployment/aws/docker-compose.ecr.yml \
            --output "$bundle" \
            --runtime-git-sha "$SOURCE_SHA" \
            --app-image "$APP_IMAGE" \
            --caddy-image "$CADDY_IMAGE"
          unzip -t "$bundle"
          bundle_dir="$(mktemp -d)"
          trap 'rm -rf "$bundle_dir"' EXIT
          unzip -q "$bundle" -d "$bundle_dir"
          test "$(find "$bundle_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          test -f "$bundle_dir/docker-compose.yml"
          TPI_APP_IMAGE="$APP_IMAGE" TPI_CADDY_IMAGE="$CADDY_IMAGE" \
            docker compose -f "$bundle_dir/docker-compose.yml" config --quiet
          sha256sum "$bundle"
          sha256sum "${bundle%.zip}.manifest.json"
      - name: Upload H3.3 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tpi-dev-ecr-${{ inputs.source_sha }}
          path: |
            dist/tpi-dev-ecr-*.zip
            dist/tpi-dev-ecr-*.manifest.json
          if-no-files-found: error
