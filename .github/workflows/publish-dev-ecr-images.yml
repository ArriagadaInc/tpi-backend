name: Publish immutable DEV images to ECR

on:
  push:
    branches:
      - feat/h2-5-simple-dev-auth
    paths:
      - '.dockerignore'
      - '.streamlit/**'
      - 'Dockerfile'
      - 'README.md'
      - 'app/**'
      - 'front/**'
      - 'pyproject.toml'
      - 'requirements/runtime.lock'
      - 'scripts/**'
      - 'deployment/caddy/**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable Git SHA to validate, build, and publish.
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: '821656895812'
  ECR_APP_REPOSITORY: tpi-dev-app
  ECR_CADDY_REPOSITORY: tpi-dev-caddy

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      - run: ruff check app/ tests/ scripts/
      - run: black --check app/ tests/ scripts/
      - run: mypy app/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tpi_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tpi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Initialize test database
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: python scripts/init_test_database.py
      - name: Run tests
        env:
          API_IDEMPOTENCY_HMAC_SECRET: ci-testing-hmac-secret-not-for-runtime
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_NAME: tpi_test
          DATABASE_USER: tpi_app
          DATABASE_PASSWORD: test_password
          DATABASE_SCHEMA: tpi
          APP_ENV: testing
        run: pytest tests/ --cov=app --cov-report=xml --cov-fail-under=85

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.lock
          python -m pip install --no-deps -e .
      - run: pip-audit --requirement requirements/runtime.lock
      - run: bandit -r app/ --severity-level medium --confidence-level medium

  docker-validate:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - run: docker build --tag tpi-dev-app:${{ inputs.source_sha || github.sha }} .
      - run: docker build --tag tpi-dev-caddy:${{ inputs.source_sha || github.sha }} --file deployment/caddy/Dockerfile .
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --env TPI_PUBLIC_SITE_ADDRESS=http://tpi.localhost
          --volume "$GITHUB_WORKSPACE/deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publish:
    name: Publish immutable images
    needs: [lint, test, security, docker-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Verify the requested revision belongs to the authorized branch
        run: |
          git fetch origin "feat/h2-5-simple-dev-auth:refs/remotes/origin/feat/h2-5-simple-dev-auth"
          git merge-base --is-ancestor "${{ inputs.source_sha || github.sha }}" origin/feat/h2-5-simple-dev-auth
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::821656895812:role/tpi-github-actions-dev-ecr-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tpi-dev-ecr-${{ github.run_id }}
      - name: Authenticate Docker to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.source_sha || github.sha }}
        run: |
          docker build --tag "$REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG" .
          docker build --tag "$REGISTRY/$ECR_CADDY_REPOSITORY:$IMAGE_TAG" --file deployment/caddy/Dockerfile .
          docker push "$REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_CADDY_REPOSITORY:$IMAGE_TAG"
      - name: Record immutable image digests
        env:
          IMAGE_TAG: ${{ inputs.source_sha || github.sha }}
        run: |
          aws ecr describe-images --repository-name "$ECR_APP_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text
          aws ecr describe-images --repository-name "$ECR_CADDY_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text
      - name: Fail closed on high or critical ECR findings
        env:
          IMAGE_TAG: ${{ inputs.source_sha || github.sha }}
        run: |
          for repository in "$ECR_APP_REPOSITORY" "$ECR_CADDY_REPOSITORY"; do
            for attempt in $(seq 1 30); do
              status=$(aws ecr describe-image-scan-findings \
                --repository-name "$repository" \
                --image-id imageTag="$IMAGE_TAG" \
                --query 'imageScanStatus.status' \
                --output text 2>/dev/null || true)
              if [ "$status" = "COMPLETE" ]; then
                break
              fi
              sleep 10
            done
            if [ "$status" != "COMPLETE" ]; then
              echo "ECR scan did not complete for $repository within five minutes."
              exit 1
            fi
            critical=$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanFindings.findingSeverityCounts.CRITICAL || `0`' \
              --output text)
            high=$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanFindings.findingSeverityCounts.HIGH || `0`' \
              --output text)
            echo "$repository: CRITICAL=$critical HIGH=$high"
            if [ "$critical" != "0" ] || [ "$high" != "0" ]; then
              echo "ECR deployment eligibility requires CRITICAL=0 and HIGH=0 for $repository."
              exit 1
            fi
          done
