items:
- id: CRM-ADJUNTOS-COMENTARIOS
  title: Adjuntos (imagenes y PDF) en los comentarios del lead
  priority: P2
  category: functional
  status: blocked
  change_class: none
  summary: 'Funcion paraguas: permitir que los usuarios suban imagenes y PDF en las notas de seguimiento
    de un lead. NO se activa. Paso 1 (CRM-ADJUNTOS-1-INFRA-S3: bucket, permisos y antivirus de S3) aplicado
    y verificado el 2026-10-21. Paso 2 (CRM-ADJUNTOS-2-CODIGO: subida, vista en linea, descarga y borrado)
    desplegado en AWS DEV y aceptado por el humano el 2026-10-21 CON OBSERVACIONES, que recoge CRM-ADJUNTOS-3-AJUSTES.
    El diseno y los resguardos estan en docs/ADJUNTOS_COMENTARIOS_DISENO.md.'
  evidence:
  - 'docs/ADJUNTOS_COMENTARIOS_DISENO.md: decisiones, riesgos aceptados, resguardos obligatorios y los
    2 pasos'
  - 'peticion del humano el 2026-10-20: ''en el crm quiero incorporar una nueva feature, que en los comentarios
    el usuario pueda subir imagenes y pdf, etc.. dado esto, hay que tomar los resguardos'''
  - 'decisiones del humano el 2026-10-21: vista en linea (no solo descarga), visibilidad para todos los
    que tienen acceso al lead (opcion B), diseno sin tabla y sin re-codificar imagenes en la primera version;
    el resto de los valores propuestos se acepto sin objecion'
  - 'dependencia cumplida: SEG-DESACOPLAR-STREAMLIT cerrada el 2026-10-21 (Pillow 13.0.0 y pip-audit sin
    excepciones)'
  - 'hallazgo del codigo: las notas no son una entidad, son texto agregado a tpi.leads.comentarios (maximo
    1000 caracteres por nota, con encabezado de fecha y autor); cada adjunto se enlaza con una marca en
    la nota'
  - 'tpi.auditoria: su contrato prohibe usar detalle como almacen de relaciones operativas, por eso solo
    guarda los eventos de los adjuntos y no sirve de registro'
  - 'paso 1 aplicado y verificado el 2026-10-21 con deployment/aws/adjuntos_s3_infra.py (apply: 12 comprobaciones
    OK; verify: 7 PASA; plan de GuardDuty 12d0afd1193ea2e81987 ACTIVE, creado sin necesitar un detector);
    ver docs/ADJUNTOS_INFRA_S3.md'
  - paso 2 desplegado el 2026-10-21 (PR 111, release 03436de, version h3-crm-adjuntos-2-codigo-03436de-domainlocked-r1)
    y aceptado por el humano con observaciones; ver evidence/CRM-ADJUNTOS-2-CODIGO y tasks/completed/CRM-ADJUNTOS-2-CODIGO.yaml
  - 'decision del humano el 2026-10-21 (opcion B): los PDF con archivos incrustados se permiten, con condiciones
    (se siguen rechazando JavaScript, /Launch y cifrados; auditoria del dato; etiqueta en la interfaz;
    ajuste para volver al rechazo; revision antes de produccion); definida en CRM-ADJUNTOS-3-AJUSTES'
- id: CRM-UI-1-ARMONIA-VISUAL
  title: 'CRM: armonia visual aprobada (tokens y componentes, iconos, tipografia alojada, edad en el listado
    y textos retirados)'
  priority: P1
  category: functional
  status: pending
  change_class: A
  summary: 'Primera tarea de la produccion minima: aplica la armonia visual aprobada en la vista previa
    local (referencia exacta en docs/ui/referencia/): estilos por escala, iconos, tipografia alojada,
    edad en el listado y textos retirados. Sin cambios de permisos ni de estados.'
  evidence:
  - docs/UI_DESIGN_SYSTEM.md (direccion, linea base y plan por tareas)
  - docs/ui/referencia/README.md (que es la referencia y como se aplica)
  - revision visual interactiva con el humano el 2026-10-22
  task:
    id: CRM-UI-1-ARMONIA-VISUAL
    title: 'CRM: armonia visual aprobada (tokens y componentes, iconos, tipografia alojada, edad en el
      listado y textos retirados)'
    objective: 'Llevar al CRM la armonia visual que el humano aprobo en la vista previa local, sin cambiar
      su identidad: valores ajustados a las escalas, un solo estilo de botones, campos, tarjetas y chips
      de estado, iconos de sol y luna, salida y descarga, logo mas grande, tipografia Plus Jakarta Sans
      alojada en el propio sitio, la edad en lugar del RUT en el listado de leads y los textos que el
      humano pidio retirar. El Developer REPRODUCE la referencia de docs/ui/referencia/ (no la reinterpreta).'
    source:
      type: story
      ref: Revision visual interactiva con el humano (2026-10-22) y docs/UI_DESIGN_SYSTEM.md; la referencia
        aprobada esta en docs/ui/referencia/.
    change_class: A
    deploy_required: true
    requires_human_acceptance: true
    acceptance_criteria:
    - id: AC-1
      verification: automated
      description: 'Referencia aplicada tal cual. app/web/static/css/app.css y las plantillas base.html,
        leads.html, leads_board.html, executive_dashboard.html y lead_detail_panel.html quedan IDENTICAS
        a las de docs/ui/referencia/ui1/ (misma ruta relativa dentro de ui1), ignorando diferencias de
        fin de linea: ''git diff --no-index --ignore-cr-at-eol <referencia> <destino>'' sin diferencias.
        Ninguna otra plantilla ni otro CSS cambia. El diff se adjunta a la evidencia.'
    - id: AC-2
      verification: automated
      description: 'Tipografia alojada. Los archivos de docs/ui/referencia/ui1/fonts/ (PlusJakartaSans-latin.woff2
        y OFL.txt) se copian a app/web/static/fonts/. Ninguna plantilla ni CSS hace pedidos a fonts.googleapis.com
        ni a fonts.gstatic.com (prueba que lo verifica leyendo base.html y app.css), el @font-face usa
        font-display: swap y la ruta /static/fonts/ responde 200 con el tipo de contenido font/woff2 en
        una prueba de la aplicacion.'
    - id: AC-3
      verification: automated
      description: 'Edad en el listado. Se aplica docs/ui/referencia/ui1/edad_en_listado.diff a _CRM_BOARD_SELECT:
        la consulta devuelve ''edad'' en anos cumplidos (NULL si no hay fecha de nacimiento) y la tabla
        del listado muestra la columna Edad (''64 anos'' o ''-'') en lugar de RUT. Pruebas: (a) con base
        de datos de prueba, la edad se calcula bien en los bordes (cumpleanos hoy y manana, sin fecha);
        (b) la fecha de nacimiento NO aparece en el HTML del listado; (c) el RUT no aparece en la tabla
        del listado pero la busqueda por RUT sigue encontrando el lead; (d) el enmascarado de RUT, correo
        y telefono para quien no es ceo o cto no cambia; (e) la exportacion a XLSX conserva exactamente
        sus columnas permitidas (EXPORT_COLUMNS) sin ''edad''.'
    - id: AC-4
      verification: automated
      description: 'Textos retirados y controles de icono, con las pruebas ajustadas SIN debilitarlas:
        (a) el aviso de la migracion 008 ya no aparece en el detalle del lead (la funcion state_history_cutover_notice
        y sus pruebas se conservan; se actualiza la que exigia el texto en la pagina, test_web_app.py);
        (b) la bajada de la lista de leads y la bajada tecnica del dashboard ya no aparecen, y la otra
        nota del dashboard se mantiene; (c) el boton de tema es un icono con aria-label, title y aria-pressed
        (theme.js no cambia) y se actualiza test_h3_3_7_theme.py; (d) cerrar sesion y exportar XLSX son
        iconos con aria-label y title, y se actualiza test_h3_3_6_export_web.py para comprobar el nombre
        accesible ''Exportar XLSX''; (e) el chip de ambiente solo esta en la barra superior. Cualquier
        otra prueba que falle por estos cambios se ajusta con el mismo criterio.'
    - id: AC-5
      verification: automated
      description: 'Medida de armonia: ''python scripts/ui_css_audit.py --json'' sobre el CSS entregado
        da lo mismo que la referencia y ninguna metrica empeora respecto de la linea base de docs/UI_DESIGN_SYSTEM.md:
        tamanos de letra distintos <= 10, radios <= 9, sombras <= 5, espaciados <= 47, colores sueltos
        distintos <= 73, reglas de tema oscuro por componente <= 41, !important <= 4. Las salidas antes
        y despues van a la evidencia.'
    - id: AC-6
      verification: automated
      description: Sin cambio de comportamiento. Rutas, permisos, enmascarado de datos personales, CSRF,
        HTMX, consultas (salvo la edad) y mensajes de negocio no cambian. La suite completa, ruff, black
        y mypy pasan; la cobertura minima del 85% se mantiene; pip-audit sin excepciones nuevas. Las plantillas
        conservan el escape HTML automatico de Jinja y no agregan scripts ni estilos en linea nuevos.
    - id: AC-7
      verification: automated
      description: 'Documentacion: docs/UI_DESIGN_SYSTEM.md se actualiza con las decisiones tomadas (tipografia
        Plus Jakarta Sans alojada, radios por rol, tonos de chip, iconos) y con lo que queda para la tarea
        posterior de consolidacion del CSS; docs/BITACORA.md tiene la entrada de la tarea; README y CHANGELOG
        si corresponde.'
    - id: AC-8
      verification: human
      description: 'Smoke visual del humano en AWS DEV tras el despliegue, comparando con la vista previa
        local aprobada: login, lista de leads (filtros, tabla, chips, columna Edad, iconos de exportar,
        tema y salida), detalle del lead (cabecera, tarjetas, notas, linea de tiempo, barra de estado),
        dashboard ejecutivo, en tema claro y oscuro, en escritorio y celular, con la tipografia nueva
        cargando desde el propio sitio; sin errores en los logs.'
    constraints:
    - 'Baseline: revalidar SHA y tree de origin/main al activar y al iniciar DEVELOPING; no desarrollar
      desde ramas o worktrees antiguos.'
    - 'change_class A: sin migracion ni cambio de esquema de base de datos, sin tocar deployment/**, IAM,
      bucket ni GuardDuty.'
    - 'La referencia en docs/ui/referencia/ es la fuente exacta: copia los archivos, no los reescribas
      ni los ''mejores''. Si algo de la referencia no funciona (por ejemplo una prueba que no se puede
      ajustar sin debilitarla), detente y reporta con evidencia en vez de cambiarla.'
    - Sin dependencias nuevas, sin CDN, scripts ni fuentes externas. La unica escritura de codigo Python
      es la edad (ui1/edad_en_listado.diff).
    - No toques app/auth/**, app/services/**, permisos ni el enmascarado de datos personales. No cambies
      el contrato de estados (eso es CRM-ESTADOS-1-CATALOGO).
    - 'No borres docs/ui/referencia/: se retira cuando cierren CRM-UI-1 y CRM-ESTADOS-1.'
    - 'Tu no ves la pagina renderizada: no afirmes que algo ''se ve bien''. La verificacion visual la
      hacen Claude (capturas con la vista previa local) y el humano (AC-8).'
    - 'Lecciones del guard de las tareas anteriores: (1) .env.example no esta en tu alcance; documenta
      solo en docs/**. (2) El payload de evidencia se escribe con Write en la ruta ABSOLUTA de la raiz
      de control (C:\desarrollos\TPI\tpi_deep_agents\tpi-backend\.harness-runtime\payloads\developer.json),
      nunca dentro del worktree. (3) progress/current.md se edita con Edit o Write, no con Python ni heredocs.
      (4) Ningun comando de shell nombra paquetes o textos denegados por policies.yaml y no se crean archivos
      sueltos en la raiz del worktree. (5) git commit va solo, sin encadenar otros comandos. (6) Si el
      guard registra mas de un worktree de Developer, retira el viejo con scripts/harness/worktree.py
      remove antes de commitear. Un DENIED es definitivo: detenerse y reportar.'
    dependencies: []
    risk:
      level: low
      notes: 'Cambio de presentacion con una referencia exacta y aprobada; el unico cambio de datos es
        la edad calculada en la consulta del listado, sin exponer la fecha de nacimiento. Riesgos: que
        una prueba existente se debilite al ajustarla (el Reviewer lo contrasta) y que la tipografia alojada
        no cargue (AC-2 y AC-8). Rollback version-only al release anterior.'
    scope:
      paths:
      - app/web/static/**
      - app/web/templates/**
      - app/repositories/solicitud_repository.py
      - tests/**
      - docs/**
      - README.md
      - CHANGELOG.md
    status: active
