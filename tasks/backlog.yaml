    - 'No agregues secretos, claves ni usuarios reales al repositorio: los ejemplos son ficticios.'
    - 'Lecciones del guard de las tareas anteriores: (1) .env.example no esta en tu alcance; documenta solo en docs/**.
      (2) El payload de evidencia se escribe con Write en la ruta ABSOLUTA de la raiz de control (C:\desarrollos\TPI\tpi_deep_agents\tpi-backend\.harness-runtime\payloads\developer.json),
      nunca dentro del worktree. (3) progress/current.md se edita con Edit o Write, no con Python ni heredocs. (4)
      Ningun comando de shell nombra paquetes o textos denegados por policies.yaml y no se crean archivos sueltos
      en la raiz del worktree. (5) git commit va solo, sin encadenar otros comandos. (6) Si el guard registra mas
      de un worktree de Developer, retira el viejo con scripts/harness/worktree.py remove antes de commitear. Un DENIED
      es definitivo: detenerse y reportar.'
