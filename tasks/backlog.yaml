        de prueba.'
    constraints:
    - 'Baseline: revalidar SHA y tree de origin/main al activar y al iniciar DEVELOPING; no desarrollar desde ramas
      o worktrees antiguos.'
    - 'change_class D: la migracion 010 y su aplicacion en AWS DEV no siguen ningun fast path; tras el merge la transicion
      obligatoria es merged_non_fast_path hacia BLOCKED_HUMAN, sin excepcion. El humano aplica la migracion en DEV
      y resuelve el estado segun el procedimiento de H3.3.4.'
    - No asumir el numero de migracion. No modificar las migraciones 001 a 009 ni sus scripts de reversa.
    - 'No modificar app/**: esta tarea no cambia el codigo de la aplicacion (la agenda es CRM-AGENDA-2-CALENDARIO).
      Tampoco deployment/**, IAM ni dependencias.'
    - tpi.citas la crea hoy setup_db.py del proyecto tpi-data-pipeline (CREATE TABLE IF NOT EXISTS) y ese proyecto
