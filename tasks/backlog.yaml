  summary: 'DIFERIDA por decision del humano (2026-10-19): no se hara por ahora ni es necesaria. Es clase
    E: crea una credencial permanente en DEV, exige ejecutar secretos fuera del LLM y tocaria rutas protegidas
    del Harness (scripts/harness/**), y el riesgo no compensa el beneficio. Sigue vigente la aceptacion
    humana del smoke autenticado en VERIFYING. Alternativa mas segura, a considerar solo si el smoke manual
    se vuelve un cuello de botella: un script que ejecuta el humano en su terminal con su propia clave
    (getpass o su entorno), que recorre el smoke autenticado e imprime PASS o FAIL, sin credenciales nuevas,
    sin identidad sintetica y sin cambios al guard. Pedia, originalmente: cuenta sintetica de minimo privilegio
    y ejecucion del smoke sin revelar secretos al LLM (p. ej. asm-exec) para eliminar la aceptacion humana
    excepcional en VERIFYING.'
