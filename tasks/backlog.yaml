    deploy_required: true
    requires_human_acceptance: true
    acceptance_criteria:
    - id: AC-1
      verification: automated
      description: 'Contrato de estados. app/models/crm_states.py queda con los 12 estados, etiquetas,
        tonos y alias de docs/ui/referencia/estados/crm_states.py (valores: nuevo, asignado, sin_contacto,
        en_seguimiento, reunion_agendada, reunion_realizada, ficha_generada, cerrado, no_interesado, datos_erroneos,
        no_contactado, perdido; las etiquetas llevan sus tildes, como en el archivo de referencia: la
        o de Reunion y la e de Datos erroneos). El alias ''pendiente'' sigue mapeando a ''nuevo''. Los
        estados anteriores (prospecto, contactado, citado, en_tramite, expediente, no_califica, duplicado,
        dormido) dejan de existir en el contrato; un valor desconocido guardado en la base se muestra
        tal cual, sin error.'
    - id: AC-2
      verification: automated
      description: '''Asignado'' sigue siendo exclusivo de la asignacion: asignar un lead a un ejecutivo
        lo pasa a ''asignado'' y registra el evento de historial como hoy; elegir ''asignado'' a mano
        en el cambio de estado se rechaza (servicio y repositorio); el selector de estado del detalle
        no lo ofrece. Las pruebas de asignacion y de historial se actualizan sin debilitarse.'
