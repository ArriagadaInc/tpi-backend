    (rol socio) y marca a los Coordinadores. Script humano con tpi_admin (plan, apply, verify y rollback), probado antes en la base local.
    Antes hay que comprobar que RDS permite btree_gist. Tarea definida y activable.'
  evidence:
  - docs/AGENDA_REUNIONES_DISENO.md, secciones 6 y 11
  - decision del humano del 2026-10-26 calendario propio y comun, visible y agendable por todos, con responsable de la asesoria y quien agendo
  task:
    id: CRM-AGENDA-1-MIGRACION
    title: 'CRM agenda 1: ampliar tpi.citas y tpi.asesores, privilegios y scripts de altas'
    objective: 'Preparar la migracion 010 del esquema que sostiene la agenda de reuniones (seccion 6 de docs/AGENDA_REUNIONES_DISENO.md):
      ampliar tpi.citas (responsable obligatorio, fecha_hora_fin, quien agendo, nota, motivo de cancelacion, updated_at,
      estados permitidos, una reunion agendada por lead y una restriccion para que un responsable no tenga dos reuniones
      que se pisen), agregar tpi.asesores.atiende_reuniones, dar a tpi_app solo SELECT, INSERT y UPDATE sobre tpi.citas,
      dejar listos el script de reversa, el bootstrap de pruebas, la documentacion de la base y los comandos humanos
      que dan de alta a CEO y CTO como responsables y marcan a los Coordinadores. La migracion la aplica el humano
      en AWS DEV.'
    source:
      type: story
      ref: 'Pedido del humano del 2026-10-26 (agenda de reuniones: calendario propio y comun, con responsable de la
        asesoria y quien agendo) y sus decisiones del mismo dia, registradas en docs/AGENDA_REUNIONES_DISENO.md.'
    change_class: D
    deploy_required: false
    requires_human_acceptance: true
    acceptance_criteria:
    - id: AC-1
      verification: automated
      description: 'Migracion hacia adelante. Existe scripts/sql/010_extend_citas_agenda.sql (el numero 010 esta libre:
        inspeccionar todo scripts/sql y la historia git antes de crearlo), transaccional (BEGIN y COMMIT), con preflight
        que aborta con un mensaje claro si tpi.citas tiene filas, si falta el esquema tpi o si btree_gist no puede
        crearse. Hace: CREATE EXTENSION IF NOT EXISTS btree_gist; en tpi.citas agrega fecha_hora_fin (TIMESTAMPTZ
        NOT NULL, CHECK fecha_hora_fin > fecha_hora), agendada_por_subject y agendada_por_nombre (texto, sin clave
        foranea), nota (texto), motivo_cancelacion (texto) y updated_at (TIMESTAMPTZ NOT NULL DEFAULT now()); deja
        id_asesor NOT NULL; agrega un CHECK de estado_cita con agendada, realizada, no_asistio y cancelada; un indice
        unico parcial sobre id_lead donde estado_cita = ''agendada''; una restriccion EXCLUDE USING gist sobre id_asesor
        y tstzrange(fecha_hora, fecha_hora_fin) donde estado_cita = ''agendada''; un indice por fecha_hora; en tpi.asesores
        agrega atiende_reuniones BOOLEAN NOT NULL DEFAULT false. Privilegios: REVOKE ALL sobre tpi.citas a PUBLIC
        y GRANT SELECT, INSERT, UPDATE a tpi_app, sin DELETE. No toca los privilegios de tpi_app sobre tpi.auditoria
        ni sobre las demas tablas.'
    - id: AC-2
      verification: automated
      description: 'Reversa. Existe scripts/sql/010_drop_citas_agenda.sql, transaccional e idempotente: aborta con
        un mensaje claro si tpi.citas tiene filas (para no perder reuniones); quita el indice, las restricciones y
        las columnas nuevas de tpi.citas y la columna atiende_reuniones de tpi.asesores, y revoca los privilegios
        nuevos de tpi_app. No elimina la tabla tpi.citas, no elimina la extension btree_gist y no toca auditoria.
        Pruebas de texto sobre ambos scripts (como las de la migracion 009) y pruebas de integracion que aplican hacia
        adelante y la reversa contra PostgreSQL, y demuestran: dos reuniones agendadas del mismo responsable que se
        pisan se rechazan; dos que no se pisan (una justo despues de la otra) se aceptan; una reunion cancelada o
        realizada no bloquea el horario; un lead no admite dos agendadas; estado_cita invalido se rechaza; fecha_hora_fin
        anterior al inicio se rechaza.'
    - id: AC-3
      verification: automated
      description: Bootstrap de pruebas. scripts/init_test_database.py crea tpi.citas con su forma final (las columnas
        originales del DDL de setup_db.py del proyecto tpi-data-pipeline mas las de la migracion 010) y tpi.asesores.atiende_reuniones,
        para que las pruebas de integracion de la tarea siguiente tengan el esquema; el resto del bootstrap no cambia.
        Las pruebas existentes de la base siguen pasando.
    - id: AC-4
      verification: automated
      description: 'Comandos humanos. scripts/dev_usuarios.py gana dos subcomandos, que son plan por defecto y escriben
        solo con --ejecutar y su frase de confirmacion (como los existentes): ''socios'' da de alta en tpi.asesores
