        sin debilitar las existentes.'
    - id: AC-5
      verification: automated
      description: Documentacion. docs/database/02_PHYSICAL_SCHEMA.md (tpi.citas y tpi.asesores con sus columnas nuevas
        y la nota de que el DDL original de citas es del proyecto tpi-data-pipeline y esta migracion lo amplia), 04_MIGRATIONS.md
        (inventario y notas de 010, con el procedimiento de aplicacion y reversa para el humano, incluida la comprobacion
        previa de btree_gist en RDS), 08_DEV_DATA_INVENTORY.md (citas, asesores y los comandos nuevos), docs/BITACORA.md
        y CHANGELOG.md. La seccion 6 de docs/AGENDA_REUNIONES_DISENO.md se actualiza si algo del diseno cambia.
    - id: AC-6
      verification: human
      description: 'Aplicacion en AWS DEV por el humano, con tpi_admin y el migration candidate congelado (SHA exacto
        de main): comprobacion previa de btree_gist, preflight, aplicacion unica y postflight (columnas, restricciones,
