- id: CRM-AGENDA-1-MIGRACION
  title: 'CRM agenda 1: ampliar tpi.citas, privilegios y alta de los Socios como responsables'
  priority: P2
  category: functional
  status: pending
  change_class: D
  summary: 'Primer paso de la agenda de reuniones (calendario propio y comun). Amplia tpi.citas (responsable obligatorio,
