- id: HARNESS-GUARDS-REPROCESO-POST-DEPLOY
  title: Guards del Harness que impiden reprocesar una tarea ya desplegada (worktree del Developer y cutover
    por tarea)
  priority: P2
  category: harness
  status: pending
  change_class: none
  summary: 'CRM-ADJUNTOS-3-AJUSTES mostro dos huecos al reprocesar una tarea despues de desplegarla (VERIFY_FAILED
    -> DEVELOPING -> nuevo candidato). (1) scripts/harness/guard.py _developer_worktree devuelve el PRIMER
    worktree de Developer registrado en state.json, asi que niega git commit y git push desde el worktree
    nuevo del reproceso; hay que tomar el ultimo registrado o que worktree.py create retire el anterior.
    (2) scripts/harness/aws_guard.py _audit_records cuenta los cutover (y rollbacks) por tarea en evidence/<tarea>/aws-audit.jsonl,
    asi que una tarea que ya desplego una vez no puede volver a hacer update-environment ("un release,
    una promocion"); debe contar por aprobacion (registros posteriores a approval.created_at). Cambio
    de scripts/harness/**: requiere una sesion de mantenimiento lanzada por el humano (TPI_HARNESS_MAINTENANCE=1),
    pruebas y revision. Mientras tanto, un arreglo posterior a un despliegue conviene como tarea nueva
    de clase A, y si ocurre el segundo hueco la salida fue la excepcion humana documentada.'
  evidence:
  - 'evidence/CRM-ADJUNTOS-3-AJUSTES/deployment/deployment-02.json: cutover ejecutado por el humano fuera
    de aws_guard, con constancia en cutover y warnings'
  - 'denegacion de aws_guard del 2026-10-22: ya hubo un intento de cutover: un release, una promocion'
  - 'denegacion del guard del 2026-10-22: el Developer solo hace commit desde su worktree registrado'
- id: AUTOMATED_AUTHENTICATED_SMOKE
  title: Smoke autenticado automatizado con identidad sintetica
  priority: P3
  category: h3.2
  status: pending
  change_class: E
  summary: 'DIFERIDA por decision del humano (2026-10-19): no se hara por ahora ni es necesaria. Es clase
    E: crea una credencial permanente en DEV, exige ejecutar secretos fuera del LLM y tocaria rutas protegidas
    del Harness (scripts/harness/**), y el riesgo no compensa el beneficio. Sigue vigente la aceptacion
    humana del smoke autenticado en VERIFYING. Alternativa mas segura, a considerar solo si el smoke manual
    se vuelve un cuello de botella: un script que ejecuta el humano en su terminal con su propia clave
    (getpass o su entorno), que recorre el smoke autenticado e imprime PASS o FAIL, sin credenciales nuevas,
    sin identidad sintetica y sin cambios al guard. Pedia, originalmente: cuenta sintetica de minimo privilegio
    y ejecucion del smoke sin revelar secretos al LLM (p. ej. asm-exec) para eliminar la aceptacion humana
    excepcional en VERIFYING.'
  evidence:
  - docs/cicd/TPI_Contrato_CICD_AWS_v2.md secciones 11 y 16
  - decision owner 2026-09-14
  - 'decision del humano el 2026-10-19, en sesion interactiva con Claude: diferida y bajada de P0 a P3;
    el contrato docs/cicd/TPI_Contrato_CICD_AWS_v2.md (secciones 11 y 16) sigue mencionando la automatizacion
    y no se modifica aqui'
