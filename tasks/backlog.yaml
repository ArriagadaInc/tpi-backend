- id: CRM-ADJUNTOS-COMENTARIOS
  title: Adjuntos (imagenes y PDF) en los comentarios del lead
  priority: P2
  category: functional
  status: blocked
  change_class: none
  summary: 'Funcion paraguas: permitir que los usuarios suban imagenes y PDF en las notas de seguimiento
    de un lead. NO se activa: se implementa en 4 pasos (CRM-ADJUNTOS-1-INFRA-S3, -2-TABLA, -3-CODIGO y
    -4-ESCANEO). El diseno, las decisiones del humano del 2026-10-21 y los resguardos estan en docs/ADJUNTOS_COMENTARIOS_DISENO.md.
    Decisiones: PDF, PNG y JPEG verificados por contenido; 10 MB por archivo, 5 por nota y 25 MB por peticion;
    vista en linea (imagenes en el detalle, PDF en pestana nueva) y descarga; retencion mientras exista
    el lead y borrado a solicitud del titular (Ley 21.719); cada subida, vista y descarga auditada; visibles
    para todos los usuarios con acceso al lead (riesgo aceptado: un archivo no se puede enmascarar).'
  evidence:
  - 'docs/ADJUNTOS_COMENTARIOS_DISENO.md: decisiones, riesgo aceptado, resguardos obligatorios y los 4
    pasos'
  - 'peticion del humano el 2026-10-20: ''en el crm quiero incorporar una nueva feature, que en los comentarios
    el usuario pueda subir imagenes y pdf, etc.. dado esto, hay que tomar los resguardos'''
  - 'decisiones del humano el 2026-10-21: vista en linea (no solo descarga) y visibilidad para todos los
    que tienen acceso al lead (opcion B); el resto de los valores propuestos se acepto sin objecion'
  - 'dependencia cumplida: SEG-DESACOPLAR-STREAMLIT cerrada el 2026-10-21 (Pillow 13.0.0 y pip-audit sin
    excepciones)'
  - 'hallazgo del codigo: las notas no son una entidad, son texto agregado a tpi.leads.comentarios (maximo
    1000 caracteres por nota, con encabezado de fecha y autor); los adjuntos seran una tabla propia ligada
    al lead'
