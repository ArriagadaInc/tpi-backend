- id: CRM-NO-CONTACTAR-1
  title: 'CRM: marca de no contactar y registro de solicitudes de supresion de datos (Ley 21.719)'
  priority: P1
  category: functional
  status: pending
  change_class: D
  summary: 'Requisito de produccion con fecha limite: la Ley 21.719 rige desde el 2026-12-01 y el protocolo
    de runners dice que, si el cliente pide no ser contactado o que se borren sus datos, se respeta de
    inmediato y se avisa al socio el mismo dia. Incluye una marca ''no contactar'' visible y bloqueante
    en el lead (con fecha, quien la registro y motivo), el estado ''No interesado'' asociado, un registro
    de solicitudes de supresion con su panel para los socios, y el procedimiento de borrado (incluidos
    los adjuntos). Cambia la base de datos (clase D, migracion con script humano). Antes de definirla
    hay que acordar con el asesor legal que se borra, que se conserva por obligacion legal y los plazos.'
  evidence:
  - TPI_Protocolo_Runners_Canal_Web.pdf, paginas 7 y 14 (respeto al no, Ley 21.719 desde el 1 de diciembre
    de 2026)
  - docs/ADJUNTOS_REVISION_PREPROD.md, punto 4 (retencion y borrado a solicitud del titular)
