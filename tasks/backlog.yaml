# Backlog del Harness. Ninguna tarea es current hasta que el humano la active.
schema_version: 1
items:
- id: SIM-HISTORIAL-EVENTOS-ANTIGUOS
  title: 'Linea de tiempo del lead: no fallar con simulaciones registradas antes de guardar sus entradas'
  priority: P0
  category: functional
  status: pending
  change_class: A
  summary: 'Defecto: el detalle de un lead devuelve 500 si tiene simulaciones generadas entre SIM-RV-V1
    y SIM-EVIDENCIA-ENTRADAS (2026-10-14 a 2026-10-16). Su detalle solo trae 5 metadatos, la vista devuelve
    entradas y resultado NULL y la plantilla lee entradas.causante.sexo sin comprobar. Hay que mostrar
    esos eventos con lo que tienen y hacer la presentacion tolerante a datos faltantes.'
  evidence:
  - 'hallazgo del humano al verificar SIM-HISTORIAL-LINEA-TIEMPO (2026-10-20): un lead de DEV mostraba
    solo ''Internal Server Error'''
  - 'causa reproducida: lead_detail_panel.html lee item.entradas.causante.sexo con entradas vacio y Jinja
    lanza UndefinedError; build_timeline_items normaliza entradas NULL a {}'
  - 'confirmado en DEV con tpi.v_historial_simulaciones: ese lead tiene 4 eventos antiguos (entradas NULL)
    y 1 evento completo'
  - definida en sesion interactiva con Claude el 2026-10-20 a pedido del humano; agregada al backlog por
    PR (no con approve.py define); se activa con approve.py activate
  task:
    id: SIM-HISTORIAL-EVENTOS-ANTIGUOS
    title: 'Linea de tiempo del lead: no fallar con simulaciones registradas antes de guardar sus entradas'
    objective: El detalle del lead no debe fallar por la forma de un evento de simulacion. Las simulaciones
      registradas antes de SIM-EVIDENCIA-ENTRADAS (detalle con solo actor_subject, role, tipo_escenario,
      version_modelo y codigo_verificacion; la vista devuelve entradas y resultado NULL) se muestran en
      la linea de tiempo con los datos que tienen y una nota, y la presentacion tolera cualquier dato
      faltante de la evidencia.
    source:
      type: story
      ref: Defecto hallado por el humano al verificar SIM-HISTORIAL-LINEA-TIEMPO (2026-10-20); definida
        en sesion interactiva con Claude.
    change_class: A
    deploy_required: true
    requires_human_acceptance: true
    acceptance_criteria:
    - id: AC-1
      verification: automated
      description: 'Un evento de simulacion antiguo (la vista devuelve entradas y resultado NULL) no rompe
        el detalle del lead: la pagina responde 200 y la linea de tiempo muestra ''Simulacion generada''
        con ejecutivo, escenario, version del modelo y codigo, mas la nota ''Registro anterior al guardado
        de entradas: solo se conservan escenario, version y codigo'', sin el detalle desplegable de entradas.'
    - id: AC-2
      verification: automated
      description: 'La presentacion y la plantilla toleran cualquier dato faltante o nulo de la evidencia:
        entradas o resultado ausentes, entradas sin causante, beneficiarios nulo o vacio, beneficiario
        con campos faltantes y fechas nulas. Ninguna combinacion produce 500. Se prueba con cargas parciales,
        no solo con la evidencia completa.'
    - id: AC-3
      verification: automated
      description: 'Sin regresion: un evento con la evidencia completa se muestra como hasta ahora (entradas,
        causante, beneficiarios con fecha de nacimiento, invalidez y relacion, y resultado); el orden
        por fecha, la visibilidad (404 si el lead no es visible) y el resto de la linea de tiempo no cambian.'
    - id: AC-4
      verification: automated
      description: Pruebas unitarias de la presentacion y de la plantilla, y de integracion en PostgreSQL
        (CI) con filas de tpi.auditoria de ambas formas (antigua y completa) leidas a traves de tpi.v_historial_simulaciones;
        cobertura total >= 85%.
    - id: AC-5
      verification: both
      description: 'CHANGELOG, BITACORA y docs/SIMULADOR_USO.md: las simulaciones anteriores al 2026-10-16
        solo conservan escenario, version del modelo y codigo, y la linea de tiempo lo indica.'
    - id: AC-6
      verification: human
      description: 'Smoke humano en AWS DEV: el lead ffd67c7a-8c1d-4891-8a6e-fa049446facc abre sin error
        y su linea de tiempo muestra sus 5 simulaciones: 4 antiguas con la nota y 1 completa con su detalle
        desplegable.'
    constraints:
    - 'Baseline: revalidar SHA y tree de origin/main al activar y al iniciar DEVELOPING; no desarrollar
      desde ramas o worktrees antiguos.'
    - 'change_class A (fast path version-only): sin migraciones, grants, vistas ni infraestructura. La
      vista tpi.v_historial_simulaciones y scripts/sql/** no se modifican.'
    - 'Leccion de SIM-HISTORIAL-LINEA-TIEMPO: toda presentacion que lea datos historicos se prueba con
      cada forma que el dato ha tenido en el tiempo, no solo con la actual. Formas de la evidencia de
      simulacion en DEV: (1) desde SIM-RV-V1 (2026-10-14): detalle con actor_subject, role, tipo_escenario,
      version_modelo y codigo_verificacion; (2) desde SIM-EVIDENCIA-ENTRADAS (2026-10-16): ademas schema_version,
      entradas y resultado.'
    - En Jinja, acceder a un atributo de un valor indefinido lanza UndefinedError (por ejemplo item.entradas.causante.sexo
      con entradas vacio). Normalizar los datos en app/web/presentation.py o comprobar cada nivel antes
      de encadenar atributos.
    - 'No inventar datos de eventos antiguos: no completar entradas ni resultado; mostrar solo lo que
      el evento tiene.'
    - No modificar app/simulador_pension/** ni app/auth/**, ni dependencias; no reducir la cobertura minima
      (85%).
    dependencies:
    - SIM-HISTORIAL-LINEA-TIEMPO
    risk:
      level: low
      notes: Cambio de presentacion acotado, sin base de datos; la regresion queda cubierta con pruebas
        de ambas formas de evento. Se despliega por fast path version-only con rollback al LKG.
    scope:
      paths:
      - app/web/presentation.py
      - app/web/templates/lead_detail_panel.html
      - app/web/static/css/app.css
      - tests/**
      - CHANGELOG.md
      - docs/BITACORA.md
      - docs/SIMULADOR_USO.md
    status: active
- id: AUTOMATED_AUTHENTICATED_SMOKE
  title: Smoke autenticado automatizado con identidad sintetica
  priority: P3
  category: h3.2
  status: pending
  change_class: E
  summary: 'DIFERIDA por decision del humano (2026-10-19): no se hara por ahora ni es necesaria. Es clase
    E: crea una credencial permanente en DEV, exige ejecutar secretos fuera del LLM y tocaria rutas protegidas
    del Harness (scripts/harness/**), y el riesgo no compensa el beneficio. Sigue vigente la aceptacion
    humana del smoke autenticado en VERIFYING. Alternativa mas segura, a considerar solo si el smoke manual
    se vuelve un cuello de botella: un script que ejecuta el humano en su terminal con su propia clave
    (getpass o su entorno), que recorre el smoke autenticado e imprime PASS o FAIL, sin credenciales nuevas,
    sin identidad sintetica y sin cambios al guard. Pedia, originalmente: cuenta sintetica de minimo privilegio
    y ejecucion del smoke sin revelar secretos al LLM (p. ej. asm-exec) para eliminar la aceptacion humana
    excepcional en VERIFYING.'
  evidence:
  - docs/cicd/TPI_Contrato_CICD_AWS_v2.md secciones 11 y 16
  - decision owner 2026-09-14
  - 'decision del humano el 2026-10-19, en sesion interactiva con Claude: diferida y bajada de P0 a P3;
    el contrato docs/cicd/TPI_Contrato_CICD_AWS_v2.md (secciones 11 y 16) sigue mencionando la automatizacion
    y no se modifica aqui'
