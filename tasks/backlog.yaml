- id: CRM-ADJUNTOS-COMENTARIOS
  title: Adjuntos (imagenes y PDF) en los comentarios del lead
  priority: P2
  category: functional
  status: blocked
  change_class: none
  summary: 'Funcion paraguas: permitir que los usuarios suban imagenes y PDF en las notas de seguimiento
    de un lead. NO se activa: se implementa en 2 pasos (CRM-ADJUNTOS-1-INFRA-S3 y CRM-ADJUNTOS-2-CODIGO).
    El diseno, las decisiones del humano del 2026-10-21 y los resguardos estan en docs/ADJUNTOS_COMENTARIOS_DISENO.md.
    Decisiones: PDF, PNG y JPEG verificados por contenido; 10 MB por archivo, 5 por nota y 25 MB por peticion;
    vista en linea (imagenes en el detalle, PDF en pestana nueva) y descarga; retencion mientras exista
    el lead y borrado a solicitud del titular (Ley 21.719); cada subida, vista y descarga auditada; visibles
    para todos los usuarios con acceso al lead (riesgo aceptado: un archivo no se puede enmascarar). Diseno
    simplificado: sin tabla (archivo y datos en S3, marca en la nota, antivirus con GuardDuty Malware
    Protection for S3) y sin re-codificar imagenes en la primera version.'
  evidence:
  - 'docs/ADJUNTOS_COMENTARIOS_DISENO.md: decisiones, riesgos aceptados, resguardos obligatorios y los
    2 pasos'
  - 'peticion del humano el 2026-10-20: ''en el crm quiero incorporar una nueva feature, que en los comentarios
    el usuario pueda subir imagenes y pdf, etc.. dado esto, hay que tomar los resguardos'''
  - 'decisiones del humano el 2026-10-21: vista en linea (no solo descarga), visibilidad para todos los
    que tienen acceso al lead (opcion B), diseno sin tabla y sin re-codificar imagenes en la primera version;
    el resto de los valores propuestos se acepto sin objecion'
  - 'dependencia cumplida: SEG-DESACOPLAR-STREAMLIT cerrada el 2026-10-21 (Pillow 13.0.0 y pip-audit sin
    excepciones)'
  - 'hallazgo del codigo: las notas no son una entidad, son texto agregado a tpi.leads.comentarios (maximo
    1000 caracteres por nota, con encabezado de fecha y autor); cada adjunto se enlaza con una marca en
    la nota'
  - 'tpi.auditoria: su contrato prohibe usar detalle como almacen de relaciones operativas, por eso solo
    guarda los eventos de los adjuntos y no sirve de registro'
- id: CRM-ADJUNTOS-1-INFRA-S3
  title: 'Adjuntos de notas, paso 1: bucket S3 privado, permisos del rol y antivirus de S3'
  priority: P2
  category: infra
  status: pending
  change_class: C
  summary: 'Crear el bucket privado de adjuntos (acceso publico bloqueado, cifrado SSE-S3, solo TLS, sin
    versionado, regla para abortar subidas multiparte incompletas), el permiso minimo del rol de la instancia
    de Elastic Beanstalk (PutObject, GetObject y DeleteObject sobre leads/*, sin ListBucket), GuardDuty
    Malware Protection for S3 con etiquetado y la politica del bucket que deniega GetObject si la etiqueta
    GuardDutyMalwareScanStatus no es NO_THREATS_FOUND. Antes se comprueba con comandos de solo lectura
    que GuardDuty Malware Protection esta disponible en la cuenta y su costo. Entregable: una plantilla
    revisable y un script de aplicacion que simula por defecto, pide una frase de confirmacion y tiene
    retroceso, como el de la migracion 009, y una prueba con un archivo de antivirus de prueba (EICAR).
    Lo aplica el humano con Claude interactivo; no es una tarea del Developer porque toca IAM.'
  evidence:
  - docs/ADJUNTOS_COMENTARIOS_DISENO.md, resguardos 4, 5 y 8
  - GuardDuty Malware Protection for S3 etiqueta cada objeto con GuardDutyMalwareScanStatus (NO_THREATS_FOUND,
    THREATS_FOUND, UNSUPPORTED, ACCESS_DENIED, FAILED); el etiquetado se activa al crear el plan de proteccion;
    una politica del bucket puede negar la lectura de lo que no tenga NO_THREATS_FOUND (https://docs.aws.amazon.com/guardduty/latest/ug/how-malware-protection-for-s3-gdu-works.html)
  - tarifa por GB escaneado publicada en https://docs.aws.amazon.com/guardduty/latest/ug/pricing-malware-protection-for-s3-guardduty.html;
    la tarifa por objeto se confirma al empezar
  - 'contrato CI/CD: los buckets e IAM son clase C (INFRA PATH: PR separado, inspeccion, ventana y retroceso)'
  - 'deployment/aws/check_eb_iam_isolation.py: comprobacion existente del aislamiento de IAM de EB'
- id: CRM-ADJUNTOS-2-CODIGO
  title: 'Adjuntos de notas, paso 2: subida, vista en linea, descarga y borrado'
  priority: P2
  category: functional
  status: blocked
  change_class: C
  summary: 'Codigo de la funcion: subida junto con la nota, validacion por contenido (firma y estructura),
    rechazo de PDF con partes activas, lectura solo del encabezado de las imagenes con tope de pixeles
    (sin re-codificar), almacenamiento en S3 con clave leads/<id_lead>/<uuid> y metadatos del objeto,
    marca [adjunto:<tipo>:<uuid>] en la nota (oculta en la vista, los resumenes del dashboard y la exportacion
    a Excel), vista en linea y descarga con las cabeceras de seguridad, borrado, auditoria en tpi.auditoria,
    limpieza de los objetos al borrar un lead de prueba y variables ATTACHMENTS_ENABLED y bucket en el
    compose de despliegue de DEV con valores literales. Es clase C porque toca deployment/**: tras el
    merge pasa por BLOCKED_HUMAN y el humano resuelve hacia PREPARING_DEPLOYMENT.'
  evidence:
  - docs/ADJUNTOS_COMENTARIOS_DISENO.md, resguardos 1 a 11 y criterios de la seccion 9
  - 'app/web/routes/leads.py (ruta de notas con CSRF) y SolicitudService.append_lead_comment: punto de
    enganche de la subida'
  - 'app/notifications/sns.py: la app ya usa el SDK de AWS con un adaptador facil de simular en pruebas'
  - 'deployment/aws/docker-compose.domainlocked.yml: las variables de configuracion llegan por el compose,
    con valores literales para el cutover version-only'
  dependencies:
  - CRM-ADJUNTOS-1-INFRA-S3
- id: SIM-CANARIA-MENSUAL
  title: Campana canaria mensual del simulador de renta vitalicia
  priority: P2
  category: ops
  status: pending
  change_class: none
  summary: La ventana de fechas validada del simulador termino el 2026-10-13 y desde entonces toda simulacion
    se calcula sin respaldo (el motor avisa solo internamente). Hace falta una campana canaria periodica
    (>= 30 casos ciegos contra el portal de Penta), actualizar VENTANA_VALIDADA y consolidar la herramienta
    de investigacion en un unico script parametrizado. Requiere una persona con credenciales del portal.
    Ver docs/SIMULADOR_USO.md, secciones 8.5 y 8.6.
