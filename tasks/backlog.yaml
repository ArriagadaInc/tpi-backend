- id: SIM-RV-V1-VENTANA
  title: 'Simulador RV: ventana de validacion abierta, con aviso de valores referenciales'
  priority: P2
  category: functional
  status: pending
  change_class: A
  summary: 'Dejar la ventana validada abierta (decision del humano 2026-10-14). OJO: sin esta tarea el
    simulador bloquea toda simulacion desde 2027-01-12 (fin de ventana 2026-10-13 + 90 dias); hasta el
    2027-01-11 genera con advertencia.'
  evidence:
  - definida en sesion interactiva con Claude el 2026-10-14 a pedido del humano; agregada al backlog por
    PR (no con approve.py define); se activa con approve.py activate
  task:
    id: SIM-RV-V1-VENTANA
    title: 'Simulador RV: ventana de validacion abierta, con aviso de valores referenciales'
    objective: 'Dejar abierta la ventana de validacion del simulador de renta vitalicia, por decision
      del humano: la simulacion se genera para cualquier fecha sin bloqueo ni advertencia por vencimiento,
      y la pantalla y el PDF indican siempre que los valores son referenciales. Sin cambios en el motor
      ni en el alcance validado de la V1.'
    source:
      type: story
      ref: 'Decision del humano el 2026-10-14: dejar la ventana validada abierta, solo con aviso de valores
        referenciales (tras aprobar la campana canaria); definida en sesion interactiva con Claude.'
    change_class: A
    deploy_required: true
    requires_human_acceptance: true
    acceptance_criteria:
    - id: AC-1
      verification: automated
      description: 'La simulacion se genera para cualquier fecha de simulacion (la fecha actual de America/Santiago):
        se elimina el estado ''bloqueado'', el corte de 90 dias y el 422 por vencimiento de la ventana;
        clasificar_ventana y VENTANA_ADVERTENCIA_DIAS dejan de condicionar la generacion.'
    - id: AC-2
      verification: both
      description: El formulario muestra siempre un aviso de que los resultados son valores referenciales
        (no vinculantes) y el PDF lo dice de forma explicita en 'Supuestos y advertencias'; desaparece
        el aviso condicional de 'ventana de validacion vencida' en pantalla y en el PDF (parametro advertencia_ventana).
    - id: AC-3
      verification: automated
      description: 'Sin cambios numericos ni de alcance: app/simulador_pension/** no se modifica (contrato
        de 435 casos dentro de +-1 UF intacto) y siguen igual los rangos validados por escenario, la autorizacion
        (403 fuera de executive, ceo y cto), el CSRF, el escape de marcado, los headers del PDF y la auditoria
        sin PII.'
    - id: AC-4
      verification: both
      description: 'Pruebas y documentacion al dia: test_sim_rv_ventana.py se reemplaza por pruebas de
        que cualquier fecha genera y de que el aviso referencial esta en pantalla y PDF; la matriz (AC-6),
        PENDIENTES (#1) y MODELO reflejan la decision del humano; CHANGELOG y BITACORA actualizados; cobertura
        total >= 85%.'
    - id: AC-5
      verification: human
      description: 'Smoke humano en AWS DEV: un ejecutivo genera un PDF y ve el aviso de valores referenciales
        en pantalla y en el PDF, sin advertencia de ventana vencida; un rol no autorizado sigue recibiendo
        403; los logs no contienen PII ni el contenido del PDF.'
    constraints:
    - 'Decision del humano (2026-10-14): la ventana validada del simulador queda abierta; ya no bloquea
      ni advierte por fecha y solo se mantiene el aviso de que los valores son referenciales. Reemplaza
      el AC-6 fail-closed de SIM-RV-V1 y no exige extender VENTANA_VALIDADA.'
    - 'Baseline: origin/main debe incluir el release de SIM-RV-V1 (1308441) o uno posterior; revalidar
      SHA y tree al activar y al iniciar DEVELOPING; no desarrollar desde ramas o worktrees antiguos.'
    - No modificar app/simulador_pension/** (el motor conserva VENTANA_VALIDADA y su warnings.warn informativo,
      que no llega a pantalla ni al PDF), ni app/auth/**, ni los rangos validados, ni dependencias, lockfiles,
      migraciones o infraestructura.
    - 'Cambios esperados: clasificar_ventana y VENTANA_ADVERTENCIA_DIAS en app/services/simulador_service.py;
      el parametro advertencia_ventana de generar_pdf y su parrafo; las lineas de app/web/routes/simulador.py
      que usan clasificar_ventana y devuelven 422; el bloque condicional de simulador.html.'
    - 'Tarea unica; clase A (fast path version-only); no cambiar la logica numerica ni el escenario validado;
      no mezclar otros cambios. Reviewer: inspeccionar un PDF real generado (aviso referencial presente,
      sin advertencia de ventana, sin RUT, correo ni telefono).'
    - No reducir la cobertura minima (85%).
    dependencies: []
    risk:
      level: medium
      notes: 'Se retira el bloqueo fail-closed de fechas (AC-6 de SIM-RV-V1) por decision del humano:
        fuera del periodo validado el modelo extrapola sin evidencia directa. Mitigacion: aviso permanente
        de valores referenciales en pantalla y PDF; la revalidacion periodica sigue siendo recomendable.'
    scope:
      paths:
      - app/services/**
      - app/web/**
      - tests/**
      - CHANGELOG.md
      - docs/SIM_RV_V1_REQUIREMENTS_MATRIX.md
      - docs/SIM_RV_V1_PENDIENTES.md
      - docs/SIM_RV_V1_MODELO.md
      - docs/BITACORA.md
    status: active
