      tpi.auditoria solo recibe eventos: su contrato prohibe usar detalle como almacen de relaciones.'
    - 'Imagenes: SIN re-codificar en esta version (decision del humano): se valida la firma y se leen
      las dimensiones del encabezado, sin decodificar pixeles. EXIF y GPS se conservan: riesgo aceptado
