schema_version: 1
task:
  id: CRM-AGENDA-2-CALENDARIO
  title: 'CRM agenda 2: calendario comun, agendar desde el lead y estados de la reunion'
  objective: 'Implementar la agenda de reuniones de la v1 (docs/AGENDA_REUNIONES_DISENO.md): pagina Agenda
    con vista de semana y de lista, tarjeta Reunion y formulario Agendar en el detalle del lead, reagendar,
    cancelar con motivo y marcar realizada o no asistio, con el responsable de la asesoria y quien agendo
    en cada reunion. El estado del lead cambia por el mismo servicio que el cambio de estado manual, cada
    accion se audita y todos los permisos se resuelven en el servidor y fallan cerrados.'
  source:
    type: story
    ref: 'Pedido del humano del 2026-10-26 (agenda de reuniones: calendario propio y comun, con responsable
      de la asesoria y quien agendo) y sus decisiones del mismo dia, registradas en docs/AGENDA_REUNIONES_DISENO.md.'
  change_class: A
  deploy_required: true
  requires_human_acceptance: true
  acceptance_criteria:
  - id: AC-1
    verification: automated
    description: 'Modelo y reglas de la reunion. Un modulo propio (constantes, repositorio y servicio
      de agenda) maneja tpi.citas con las columnas de la migracion 010 y valida en el servidor, no solo
      en el formulario: horario lunes a viernes de 09:00 a 19:00 hora de Chile (America/Santiago, con
      ZoneInfo como el resto de la app); inicio cada 15 minutos; duracion de 30, 45 o 60 minutos (30 por
      defecto); no se agenda en el pasado; modalidad Google Meet, Llamada o Presencial; enlace y nota
      opcionales (nota de hasta 500 caracteres); un lead con una reunion agendada no admite otra; el lead
      debe estar activo (no cerrado, perdido, no_interesado, datos_erroneos ni no_contactado). Si el responsable
      ya tiene una reunion que se pisa, responde un mensaje claro con el tramo ocupado, y lo mismo si
      la base rechaza la solicitud por la restriccion (dos solicitudes simultaneas). Pruebas de cada regla,
      incluidos los dos cambios de hora de Chile del ano.'
  - id: AC-2
    verification: automated
    description: Responsable de la reunion (decision del humano). El responsable es una fila activa de
      tpi.asesores con atiende_reuniones = true. El Runner solo puede elegir como responsable a un Socio
      (rol 'socio'). El Coordinador solo agenda leads de su cartera y puede ser el responsable o elegir
      a un Socio. El Socio agenda cualquier lead y elige a un Socio o al Coordinador dueño de la cartera
      de ese lead; un Coordinador solo es responsable de leads de su propia cartera. Un Runner nunca es
      responsable. El servidor lo valida con los datos de la base, no con lo que envia el formulario,
      y el formulario solo ofrece las opciones validas. Matriz de pruebas actor x responsable x lead propio
      o ajeno.
  - id: AC-3
    verification: automated
    description: 'Acciones y estado del lead. Agendar, reagendar, cancelar (motivo obligatorio), marcar
      realizada y marcar no asistio, con los efectos de la seccion 4 del diseno: agendar deja el lead
      en reunion_agendada; cancelar y no asistio lo devuelven a en_seguimiento; realizada lo pasa a reunion_realizada.
      Agendar, reagendar y cancelar: Runner, Coordinador y Socio con alcance sobre el lead; marcar realizada
      y no asistio: solo Coordinador y Socio con alcance (el Runner recibe un rechazo real, como hoy con
      reunion_realizada). El cambio de estado del lead reutiliza update_lead_status (misma validacion
      y misma auditoria) y ocurre en la MISMA transaccion que la reunion: si una falla, no queda la otra.
      Una reunion realizada, cancelada o no asistio no se reabre.'
  - id: AC-4
    verification: automated
    description: Calendario comun y privacidad. GET /agenda (vista semana con navegacion anterior, siguiente
      y hoy, y vista lista; en celular solo la lista) disponible para todo usuario autenticado, con filtro
      por responsable. Cada reunion muestra hora, responsable, quien agendo, modalidad y estado. Si el
      lead esta fuera del alcance de quien mira, la respuesta del servidor NO contiene su nombre, su id
      ni un enlace (se lee la respuesta, no solo la pantalla) y el bloque dice que es de otra cartera;
      un Socio ve todos. El menu superior gana la entrada Agenda para todos los perfiles.
  - id: AC-5
    verification: automated
    description: Detalle del lead. Tarjeta Reunion con la reunion agendada (o la ultima), el boton Agendar
      reunion y las acciones permitidas al perfil; el formulario pide fecha, hora, duracion, responsable,
      modalidad, enlace y nota, con el token CSRF y las mismas protecciones del cambio de estado. Se aplica
      el sistema visual vigente (docs/UI_DESIGN_SYSTEM.md y docs/ui/referencia/) sin tipografias, scripts
      ni librerias nuevas. Si la base falla o le faltan las columnas de la migracion 010, la tarjeta y
      la pagina Agenda muestran un aviso y el resto del CRM sigue funcionando.
  - id: AC-6
    verification: automated
    description: 'Permisos: matriz completa de pruebas rol x accion x alcance. Lectura y escritura, GET
      y POST, lead propio y ajeno, entre carteras de Runners y de Coordinadores, rol de solo lectura (executive
      y readonly no escriben), peticiones armadas a mano, token CSRF invalido y usuario sin sesion. Un
      lead de otra cartera responde como hoy (404 o 403 segun la ruta, sin filtrar su existencia). Ningun
      permiso existente se amplia: no cambian el dashboard, la exportacion, los adjuntos, el simulador
      ni la asignacion.'
  - id: AC-7
    verification: automated
    description: Auditoria. Cada accion deja un evento en tpi.auditoria por el mecanismo vigente (cita_agendada,
      cita_reagendada, cita_cancelada, cita_realizada, cita_no_asistio; tabla_afectada = 'tpi.citas'),
      con el sujeto autenticado, el id de la reunion, el responsable y las horas anterior y nueva. El
      detalle no lleva nombre ni datos personales del lead. Pruebas de cada evento. La app nunca borra
      una reunion.
  - id: AC-8
    verification: automated
    description: Calidad. Documentacion de uso en docs/ (la agenda, sus reglas y sus permisos), CHANGELOG.md
      y docs/BITACORA.md; cobertura minima del proyecto sin bajar (85%); Lint, formato y auditoria de
      seguridad verdes; sin dependencias nuevas.
  - id: AC-9
    verification: human
    description: 'Prueba humana en AWS DEV con un usuario de cada perfil: el Runner agenda un lead de
      su cartera con un Socio y no puede elegir a un Coordinador ni marcar realizada; el Coordinador ve
      el calendario completo (los leads ajenos sin nombre), agenda uno de su cartera como responsable
      y lo marca realizada; el Socio ve todo, reagenda, cancela y marca no asistio; dos reuniones del
      mismo responsable no se pisan; el estado del lead cambia como indica el diseno. Se prueba tambien
      en un celular.'
  constraints:
  - 'Baseline: revalidar SHA y tree de origin/main al activar y al iniciar DEVELOPING; no desarrollar
    desde ramas o worktrees antiguos.'
  - 'change_class A: sin migracion ni cambio de esquema de base de datos, sin tocar deployment/**, IAM,
    bucket ni GuardDuty. La base ya tiene la migracion 010 (CRM-AGENDA-1-MIGRACION) aplicada en DEV; si
    no puedes apoyarte en ella, detente y reporta.'
  - 'Seguridad primero: toda autorizacion es del servidor y falla cerrada; la interfaz solo guia. Cada
    cambio de permiso lleva pruebas que demuestran lo permitido Y lo denegado. No amplies ningun acceso
    mas alla de lo descrito. Reutiliza has_portfolio_scope, update_lead_status y el alcance de cartera
    existentes; no escribas una segunda regla de alcance.'
  - 'tpi_app solo tiene SELECT, INSERT y UPDATE sobre tpi.citas: no uses DELETE ni pidas mas privilegios.'
  - 'No implementes sincronizacion con Google Calendar ni Meet, recordatorios, correos, WhatsApp, feriados,
    disponibilidad por Socio, intentos, cadencia, calificacion, comisiones ni la marca ''no contactar'':
    son modulos posteriores. Tampoco cambies el contrato de estados (app/models/crm_states.py) ni la asignacion.'
  - 'No agregues secretos, claves ni usuarios reales al repositorio: los ejemplos son ficticios.'
  - 'Lecciones del guard de las tareas anteriores: (1) .env.example no esta en tu alcance; documenta solo
    en docs/**. (2) El payload de evidencia se escribe con Write en la ruta ABSOLUTA de la raiz de control
    (C:\desarrollos\TPI\tpi_deep_agents\tpi-backend\.harness-runtime\payloads\developer.json), nunca dentro
    del worktree. (3) progress/current.md se edita con Edit o Write, no con Python ni heredocs. (4) Ningun
    comando de shell nombra paquetes o textos denegados por policies.yaml y no se crean archivos sueltos
    en la raiz del worktree. (5) git commit va solo, sin encadenar otros comandos. (6) Si el guard registra
    mas de un worktree de Developer, retira el viejo con scripts/harness/worktree.py remove antes de commitear.
    Un DENIED es definitivo: detenerse y reportar.'
  dependencies:
  - CRM-AGENDA-1-MIGRACION
  risk:
    level: high
    notes: 'Toca autorizacion y datos personales: un calendario comun puede filtrar leads de otras carteras
      y un permiso mal resuelto abre acceso de mas. Mitigado porque el servidor recorta los datos antes
      de responder, porque reutiliza el alcance de cartera y el cambio de estado ya probados, por la matriz
      de pruebas rol x accion x alcance, por la revision del Reviewer con enfoque de seguridad, por el
      smoke humano con un usuario de cada perfil y por el rollback version-only.'
  scope:
    paths:
    - app/models/**
    - app/repositories/**
    - app/services/**
    - app/web/**
    - tests/**
    - docs/**
    - README.md
    - CHANGELOG.md
