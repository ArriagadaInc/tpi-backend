schema_version: 1
task:
  id: SIM-FICHA-PDF
  title: 'Simulador: ficha PDF con el formato ''Estudio de pension'' de TPI'
  objective: 'Hacer que el PDF del simulador tenga el formato de la ficha ''Estudio de pension'' de TPI:
    pagina apaisada, banda azul marino con nombre, titulo y fecha, tablas de Opcion I y II con Rescate
    Total, bloque de contacto y logo oficial. Se conservan la leyenda referencial, el codigo de verificacion
    y la prohibicion de RUT, correo y telefono del lead.'
  source:
    type: story
    ref: Observaciones del humano sobre el simulador y el CRM (2026-10-15); definida en sesion interactiva
      con Claude.
  change_class: A
  deploy_required: true
  requires_human_acceptance: true
  acceptance_criteria:
  - id: AC-1
    verification: both
    description: 'El PDF sigue docs/specs/SIM_FICHA_PDF_SPEC.md: Carta apaisada; banda azul marino #0f243e
      con tratamiento y nombre del cliente, titulo ''ESTUDIO DE PENSIÓN'' y fecha; fila de datos (fecha
      de nacimiento, conyuge, tasa T y valor UF si se informo); tabla de ''OPCIÓN I'' con ''Renta Vitalicia
      Inmediata'' y ''Rescate Total''; y ''OPCIÓN II'' con ''Aumento Temporal de Pensión'' e ''Inflación
      Futura 4%'' cuando hay aumento temporal.'
  - id: AC-2
    verification: automated
    description: 'Los calculos derivados siguen la especificacion y se prueban con datos sinteticos: Rescate
      Total = pension UF x meses garantizados; $ Valor Actual = pension UF x valor UF; Valor Futuro =
      Valor Actual x 1,04^anios del aumento; Rescate Total de la Opcion II = pension aumentada x meses
      del aumento + pension base x (meses garantizados - meses del aumento).'
  - id: AC-3
    verification: both
    description: Pie con el nombre del ejecutivo y los datos de contacto corporativos de TPI como texto
      plano (sin enlaces activos), y banda azul marino inferior con el logo oficial (official-logo-on-dark.png);
      sin telefono personal, sin RUT ni correo del lead, sin bloque PGU/BAC, sin fila 'RP (AFP)' y sin
      comparativa de varias opciones.
  - id: AC-4
    verification: automated
    description: 'Se conservan: la leyenda ''Estimacion referencial no vinculante'', la version del modelo,
      el codigo de verificacion, el escape de marcado de todo texto de datos, los metadatos genericos
      sin PII, la ausencia de enlaces, scripts y adjuntos, el nombre de archivo y los headers (no-store,
      nosniff) y el evento de auditoria; la renta temporal con RVD conserva su seccion con la nueva apariencia.'
  - id: AC-5
    verification: automated
    description: 'Sin regresion: motor intacto, autorizacion y CSRF sin cambios; cobertura total >= 85%;
      docs y CHANGELOG y BITACORA actualizados.'
  - id: AC-6
    verification: human
    description: 'Smoke humano en AWS DEV: el humano genera un PDF y lo compara con la ficha de ejemplo
      (apaisado, banda, tablas, pie y logo); se lee bien en pantalla y al imprimir, y no contiene RUT,
      correo ni telefono del lead.'
  constraints:
  - 'Baseline: revalidar SHA y tree de origin/main al activar y al iniciar DEVELOPING; no desarrollar
    desde ramas o worktrees antiguos.'
  - 'Tarea unica; no mezclar otros cambios ni dejar alcance diferido sin documentarlo. Clase A (fast path
    version-only): sin migraciones, grants, vistas, constraints ni infraestructura; si hicieran falta
    es BLOCKER: detenerse y escalar al humano.'
  - No modificar app/simulador_pension/** (motor), app/auth/**, dependencias ni lockfiles; no cambiar
    la logica numerica, los rangos validados, la autorizacion (403 fuera de executive, ceo y cto) ni el
    escape de marcado del PDF.
  - No reducir la cobertura minima (85%).
  - 'Fuente de verdad del diseno: docs/specs/SIM_FICHA_PDF_SPEC.md. La ficha de ejemplo contiene datos
    de una persona real: NO se copia al repositorio ni se usa en pruebas; las pruebas usan datos sinteticos.'
  - 'Tipografia Helvetica (equivalente PDF de Arial) con reportlab; sin fuentes ni dependencias nuevas.
    Las decisiones de la seccion ''Fuera de alcance'' de la especificacion no se inventan: quedan documentadas
    en PENDIENTES.'
  - 'Reviewer: generar un PDF real y compararlo con la especificacion (inspeccion con pymupdf: sin enlaces,
    metadatos genericos, sin RUT, correo ni telefono).'
  dependencies: []
  risk:
    level: medium
    notes: El PDF se entrega a clientes; un error de formato o de calculo derivado (Rescate Total, Valor
      Futuro) llegaria al cliente. Mitigado con reglas verificadas contra el ejemplo y pruebas con datos
      sinteticos.
  scope:
    paths:
    - app/services/**
    - app/web/**
    - tests/**
    - CHANGELOG.md
    - docs/BITACORA.md
    - docs/specs/SIM_FICHA_PDF_SPEC.md
    - docs/SIM_RV_V1_REQUIREMENTS_MATRIX.md
    - docs/SIM_RV_V1_PENDIENTES.md
    - docs/SIM_RV_V1_MODELO.md
  status: closed
