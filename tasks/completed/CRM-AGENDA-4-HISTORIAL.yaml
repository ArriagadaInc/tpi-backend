schema_version: 1
task:
  id: CRM-AGENDA-4-HISTORIAL
  title: 'CRM agenda 4b: eventos de la agenda en el historial del lead y casos por asesor separados en
    coordinadores y runners'
  objective: Dos mejoras del CRM. (1) Los eventos de la agenda (agendada, reagendada, cancelada, realizada
    y no asistio) aparecen en el historial del lead (Seguimiento y Notas Internas), leidos de la vista
    tpi.v_historial_agenda que crea la tarea anterior. (2) En el dashboard ejecutivo, la tabla de casos
    por asesor (Resumen por asesor y su detalle de casos por estado) separa a los Coordinadores de los
    Runners; los Socios no aparecen porque no tienen cartera asignada. Las reglas de la agenda, los permisos,
    la privacidad de los leads ajenos y el CSRF no cambian.
  source:
    type: story
    ref: 'Pedido del humano del 2026-10-27: separar coordinadores de runners en la tabla de casos por
      asesor del dashboard (los socios no van, no tienen cartera asignada) y dejar los eventos del agendamiento
      en el historial del lead. Orden y alcance acordados el mismo dia.'
  change_class: A
  deploy_required: true
  requires_human_acceptance: true
  acceptance_criteria:
  - id: AC-1
    verification: automated
    description: Lectura de los eventos. AgendaRepository gana un metodo que devuelve los eventos de agenda
      de un lead leyendo UNICAMENTE la vista tpi.v_historial_agenda (nunca tpi.auditoria ni tpi.citas)
      unida con tpi.asesores por responsable_id (LEFT JOIN) para el nombre del responsable, ordenados
      por fecha_hora DESC, id_auditoria DESC. Se expone por AgendaService y por las fakes y protocolos
      de app/web/dependencies.py (la fake devuelve lista vacia). Pruebas del repositorio (la consulta
      menciona la vista y no tpi.auditoria) e integracion contra PostgreSQL con filas producidas por el
      flujo real de la agenda (agendar, reagendar, cancelar, realizada, no asistio) que devuelven las
      cinco acciones con el nombre del responsable.
  - id: AC-2
    verification: automated
    description: 'Linea de tiempo. build_timeline_items (app/web/presentation.py) gana un parametro opcional
      agenda_events (por defecto None: las llamadas existentes y sus pruebas no cambian) y produce items
      kind=''agenda'' con timestamp en America/Santiago, display_time, actor, accion, nombre del responsable,
      la fecha de la reunion (fecha_hora_nueva si existe, si no fecha_hora_anterior) y, para reagendada,
      la fecha anterior. Se integra en el orden estable de _SOURCE_RANK sin alterar el orden relativo
      de los tipos existentes: las pruebas actuales de orden y de empate (tests/unit/test_h3_3_3_timeline_presentation.py,
      test_h3_3_4_timeline_presentation.py y test_sim_historial_timeline_presentation.py) se mantienen
      sin cambios. Pruebas nuevas del orden con eventos de agenda mezclados con notas, cambios de estado
      y simulaciones, incluido un empate exacto.'
  - id: AC-3
    verification: automated
    description: 'Presentacion. El detalle del lead (app/web/templates/lead_detail_panel.html) muestra
      cada evento con la insignia ''Automatico'' y el actor, igual que los otros eventos automaticos,
      con estos textos (fechas como DD/MM/AAAA HH:MM en hora de Santiago): agendada: ''Reunión agendada
      para <fecha> con <responsable>''; reagendada: ''Reunión reagendada: <fecha anterior> → <fecha nueva>
      (con <responsable>)''; cancelada: ''Reunión cancelada (era el <fecha> con <responsable>)''; realizada:
      ''Reunión realizada (<fecha> con <responsable>)''; no asistio: ''El lead no asistió a la reunión
      (<fecha> con <responsable>)''. Si el responsable no se puede resolver, se escribe ''responsable
      no disponible''. No se muestran la nota ni el motivo de cancelacion (no estan en la auditoria) ni
      ningun id interno (id_cita, id_auditoria, id del responsable). Se reutilizan las clases existentes
      del historial; solo se agrega CSS si es indispensable y usando los tokens del CRM. Pruebas que leen
      el HTML renderizado de las cinco acciones, del caso sin responsable y del orden junto a notas.'
  - id: AC-4
    verification: automated
    description: 'Alcance y degradacion. Los eventos de agenda se cargan solo cuando el usuario puede
      abrir el lead (el mismo control que ya aplica el detalle): un Runner que abre un lead de otra cartera
      no obtiene eventos de agenda y el servicio de agenda no se consulta para ese lead; Coordinador y
      Socio los ven en los leads que pueden abrir. Si la lectura de la vista falla, el detalle del lead
      sigue respondiendo 200 con el resto del historial, sin las lineas de agenda y sin volcar el error
      ni datos personales al log. Pruebas de los tres perfiles, del lead ajeno y de la falla.'
  - id: AC-5
    verification: automated
    description: 'Dashboard: coordinadores y runners por separado. En el Resumen por asesor y en su detalle
      ''Ver casos por estado y asesor'', los asesores se agrupan por su perfil: Coordinador = fila de
      tpi.asesores con rol ''asesor'' y atiende_reuniones = true; Runner = rol ''asesor'' y atiende_reuniones
      = false. Cada grupo tiene su titulo, su tabla con las mismas columnas de hoy y una fila de subtotal
      solo de conteos (cartera total, cartera activa y estancados; las columnas de tiempos promedio no
      se suman y el subtotal muestra ''—''). Un grupo sin cartera muestra un estado vacio (''Sin coordinadores
      con cartera'' o ''Sin runners con cartera''). Los Socios (rol ''socio'') no aparecen porque no tienen
      cartera; solo si por datos inesperados un Socio tuviera leads asignados, aparece un tercer grupo
      ''Socios'' para que ningun lead quede fuera de la vista. ''Sin asesor'' sigue aparte, como hoy.
      Se conservan: N/D nunca como cero, los filtros (estado, asesor, AFP, origen, fuente), el nombre
      del asesor visible solo para CEO/CTO, la ausencia de datos personales, el manejo de seccion fallida
      y las pruebas actuales sin debilitarlas. El repositorio trae rol y atiende_reuniones en las mismas
      consultas (sin consultas nuevas) y el servicio calcula el grupo. Pruebas del servicio con filas
      de Coordinador, Runner, Socio y sin asignar; del HTML renderizado (dos grupos, subtotales, estado
      vacio, Socio oculto, nombres solo para CEO/CTO); del SQL; e integracion contra PostgreSQL.'
  - id: AC-6
    verification: automated
    description: Calidad y documentacion. Pasan el formato y el lint del proyecto (black, isort, ruff,
      mypy segun la configuracion del repositorio) y toda la suite, sin debilitar pruebas existentes.
      Se documentan en docs/** (docs/AGENDA_USO.md para el historial; la documentacion del dashboard ejecutivo
      para los dos grupos), docs/BITACORA.md y CHANGELOG.md. Sin dependencias, tipografias, scripts ni
      librerias nuevas.
  - id: AC-7
    verification: human
    description: 'Revision visual en AWS DEV (despues de aplicada la migracion 011), escritorio y celular,
      tema claro y oscuro. (a) Historial del lead: en un lead con reuniones aparecen agendada, reagendada,
      cancelada, realizada y no asistio, con la fecha, el responsable y quien lo hizo, mezcladas en orden
      con las notas y los cambios de estado. Un Runner no las ve en un lead ajeno. (b) Dashboard con CEO
      o CTO: la tabla de casos por asesor muestra Coordinadores y Runners por separado, con sus subtotales,
      y no aparecen los Socios.'
  constraints:
  - 'Baseline: revalidar SHA y tree de origin/main al activar y al iniciar DEVELOPING; no desarrollar
    desde ramas o worktrees antiguos.'
  - 'change_class A: sin migracion ni cambio de esquema de base de datos, sin tocar scripts/sql/**, deployment/**,
    IAM, bucket ni GuardDuty. La vista tpi.v_historial_agenda ya existe (la crea la migracion 011 de CRM-AGENDA-4-HISTORIAL-MIGRACION,
    aplicada en DEV antes de activar esta tarea): no la modifiques; si su contrato no alcanza, detente
    y reporta.'
  - 'La aplicacion nunca lee tpi.auditoria directamente: el historial usa solo la vista. No modifiques
    el escritor de la auditoria de la agenda ni las reglas, permisos, CSRF o rutas de la agenda; no toques
    app/auth/**.'
  - 'Privacidad: el historial no muestra ids internos ni datos de contacto, y un lead fuera de alcance
    no entrega ningun evento. En el dashboard el nombre del asesor sigue visible solo para CEO/CTO y nunca
    se muestra RUT, correo ni telefono.'
  - Los Socios no tienen cartera asignada y no son una columna de la tabla; el unico caso en que se muestran
    es el descrito en AC-5, para no ocultar leads.
  - 'No agregues secretos, claves ni usuarios reales al repositorio: los ejemplos son ficticios.'
  - 'Lecciones del guard de las tareas anteriores: (1) .env.example no esta en tu alcance; documenta solo
    en docs/**. (2) El payload de evidencia se escribe con Write en la ruta ABSOLUTA de la raiz de control
    (C:\desarrollos\TPI\tpi_deep_agents\tpi-backend\.harness-runtime\payloads\developer.json), nunca dentro
    del worktree. (3) progress/current.md se edita con Edit o Write, no con Python ni heredocs. (4) Ningun
    comando de shell nombra paquetes o textos denegados por policies.yaml y no se crean archivos sueltos
    en la raiz del worktree. (5) git commit va solo, sin encadenar otros comandos. (6) Si el guard registra
    mas de un worktree de Developer, retira el viejo con scripts/harness/worktree.py remove antes de commitear.
    Un DENIED es definitivo: detenerse y reportar.'
  dependencies: []
  risk:
    level: low
    notes: 'Lectura de una vista nueva y agrupacion en el dashboard. Riesgos: que el historial muestre
      eventos de un lead ajeno o rompa el detalle si la vista falla, y que el dashboard deje leads sin
      mostrar al separar por perfil; mitigados por el control de alcance existente, la degradacion probada
      en AC-4 y el grupo defensivo de AC-5.'
  scope:
    paths:
    - app/**
    - tests/**
    - docs/**
    - CHANGELOG.md
  status: closed
