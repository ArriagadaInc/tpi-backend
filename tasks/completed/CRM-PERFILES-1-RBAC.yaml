schema_version: 1
task:
  id: CRM-PERFILES-1-RBAC
  title: 'CRM: tres perfiles de usuario (Runner, Coordinador y Socio) con permisos por perfil'
  objective: 'Modelar los tres perfiles del protocolo de runners: Runner (ejecutivo normal que solo ve
    su cartera; hoy el rol ''advisor''), Coordinador (rol nuevo: como el runner, solo su cartera, pero
    con autoridad de asesorar) y Socio (perfil ejecutivo como CEO y CTO, que ven todo). Solo los socios
    asignan leads. Los runners y coordinadores pueden subir y ver adjuntos de los leads de su cartera.
    Todo se resuelve en el servidor y falla cerrado.'
  source:
    type: story
    ref: Protocolo de trabajo para Runners (TPI_Protocolo_Runners_Canal_Web.pdf (reunion de equipo runners,
      octubre 2026)) y decisiones del humano del 2026-10-22 (perfiles, asignacion solo de socios, adjuntos
      para runners).
  change_class: A
  deploy_required: true
  requires_human_acceptance: true
  acceptance_criteria:
  - id: AC-1
    verification: automated
    description: 'Perfiles. Se agrega el rol ''coordinator'' a UserRole y a los roles permitidos de la
      autenticacion; ''advisor'' se muestra como ''Runner'', ''coordinator'' como ''Coordinador'' y ''ceo''
      y ''cto'' como ''Socio'' (solo etiqueta de pantalla: una funcion unica y probada). La barra superior
      muestra el perfil junto al nombre. Los roles tecnicos existentes (tester, admin, executive, operations,
      readonly) no cambian de nombre.'
  - id: AC-2
    verification: automated
    description: 'Cartera propia. El coordinador queda con el MISMO alcance de cartera que el advisor
      en el servidor: listado, detalle, notas, cambio de estado, adjuntos, simulador y cualquier ruta
      por id de lead; un lead de otra cartera responde como hoy (404 o 403 segun la ruta, sin filtrar
      existencia). Toda comprobacion ''user.role == advisor'' se generaliza a una funcion unica de alcance
      de cartera. La configuracion de usuarios exige advisor_id para coordinator igual que para advisor
      y se resuelve a un asesor activo; si no resuelve, falla cerrado (tablero vacio). Pruebas cruzadas:
      runner A no ve ni toca leads del runner B ni del coordinador, y al reves.'
  - id: AC-3
    verification: automated
    description: Asignacion solo de socios. can_assign_lead devuelve verdadero unicamente para ceo y cto;
      los roles admin y executive pierden la asignacion. El formulario de asignar no se muestra a otros
      perfiles y el servidor responde con rechazo real (403 o PermissionError segun la capa) aunque se
      envie la peticion a mano. Las pruebas de asignacion se actualizan sin debilitarse.
  - id: AC-4
    verification: automated
    description: Simulador y asesoria. El coordinador puede abrir y usar el simulador solo sobre leads
      de su cartera; el runner recibe 403 real (como hoy el advisor); socios y el rol executive actual
      conservan su acceso. El boton del simulador no se muestra al runner. Pruebas de la matriz completa
      para simular y para descargar el PDF.
  - id: AC-5
    verification: automated
    description: Cambio de estado por perfil (SOLO reglas de perfil, no de secuencia). El runner puede
      fijar nuevo, sin_contacto, en_seguimiento, reunion_agendada, no_interesado, datos_erroneos, no_contactado
      y perdido; NO puede fijar reunion_realizada, ficha_generada ni cerrado (los fija el socio o el coordinador
      sobre su caso). El coordinador puede fijar todos los estados de su cartera excepto 'asignado'; el
      socio, todos excepto 'asignado'. El rechazo es del servidor, el selector de la interfaz solo ofrece
      lo permitido y se audita como hoy. Pruebas de la matriz perfil x estado.
  - id: AC-6
    verification: automated
    description: 'Lo que NO cambia y se prueba: runner y coordinador no acceden al dashboard ejecutivo,
      a la exportacion XLSX ni al borrado de adjuntos (siguen siendo de ceo y cto); el enmascarado de
      datos personales se mantiene (los datos de SU cartera siguen sin enmascarar para runner y coordinador,
      como hoy para el advisor); runner y coordinador pueden subir, ver y descargar adjuntos de los leads
      de su cartera con las mismas validaciones y auditoria que los demas perfiles.'
  - id: AC-7
    verification: automated
    description: 'Pruebas y documentacion: matriz de pruebas rol x accion (ver cartera, ver datos completos,
      asignar, cambiar estado, simular, exportar, dashboard, adjuntos) con el 403 o 404 esperado; docs/SEGURIDAD.md
      con la matriz de permisos por perfil; documentacion de la configuracion de usuarios (valor ''coordinator'',
      ejemplo SIN secretos ni claves); docs/BITACORA.md. Suite completa, ruff, black y mypy en verde;
      cobertura >= 85%; pip-audit sin excepciones.'
  - id: AC-8
    verification: human
    description: 'Smoke del humano en DEV con un usuario de cada perfil (runner, coordinador y socio):
      el humano agrega los usuarios de prueba a la configuracion de usuarios del ambiente (secreto fuera
      del repositorio) con su advisor_id, asigna leads como socio, y comprueba que el runner y el coordinador
      solo ven su cartera, que solo el socio asigna, que el simulador solo lo usan coordinador y socio,
      que el runner no puede marcar ''Reunion realizada'', y que sube y ve un adjunto.'
  constraints:
  - 'Baseline: revalidar SHA y tree de origin/main al activar y al iniciar DEVELOPING; no desarrollar
    desde ramas o worktrees antiguos.'
  - 'change_class A: sin migracion ni cambio de esquema de base de datos, sin tocar deployment/**, IAM,
    bucket ni GuardDuty.'
  - 'Seguridad primero: toda autorizacion es del servidor y falla cerrada; la interfaz solo guia. Cada
    cambio de permiso lleva pruebas que demuestran lo permitido Y lo denegado. No amplies ningun acceso
    mas alla de lo descrito.'
  - 'No renombres los roles existentes en el codigo ni en la configuracion de usuarios (''advisor'' sigue
    siendo el valor del runner): el cambio de nombre es solo de etiqueta.'
  - 'No agregues secretos, claves ni usuarios reales al repositorio: los ejemplos son ficticios.'
  - Tampoco cambies el contrato de estados (CRM-ESTADOS-1) ni el aspecto (CRM-UI-1); usa los estados nuevos
    tal como esten en main.
  - 'No implementes intentos, reuniones, ''no contactar'' ni comisiones: son modulos posteriores.'
  - 'Lecciones del guard de las tareas anteriores: (1) .env.example no esta en tu alcance; documenta solo
    en docs/**. (2) El payload de evidencia se escribe con Write en la ruta ABSOLUTA de la raiz de control
    (C:\desarrollos\TPI\tpi_deep_agents\tpi-backend\.harness-runtime\payloads\developer.json), nunca dentro
    del worktree. (3) progress/current.md se edita con Edit o Write, no con Python ni heredocs. (4) Ningun
    comando de shell nombra paquetes o textos denegados por policies.yaml y no se crean archivos sueltos
    en la raiz del worktree. (5) git commit va solo, sin encadenar otros comandos. (6) Si el guard registra
    mas de un worktree de Developer, retira el viejo con scripts/harness/worktree.py remove antes de commitear.
    Un DENIED es definitivo: detenerse y reportar.'
  dependencies:
  - CRM-ESTADOS-1-CATALOGO
  risk:
    level: high
    notes: 'Toca autorizacion, el centro de la seguridad del CRM: puede abrir acceso de mas o cerrar acceso
      de menos. Mitigado porque el coordinador reutiliza el alcance de cartera ya probado del advisor,
      porque no hay cambios de datos ni de esquema, por la matriz de pruebas rol x accion (permitido y
      denegado), por la revision del Reviewer con enfoque de seguridad, por el smoke humano con un usuario
      de cada perfil y por el rollback version-only.'
  scope:
    paths:
    - app/auth/**
    - app/models/**
    - app/services/**
    - app/repositories/**
    - app/web/**
    - tests/**
    - docs/**
    - README.md
    - CHANGELOG.md
